# Dependabot — SECURITY updates only (no version-update churn).
#
# Why this shape:
#   - open-pull-requests-limit: 0 disables Dependabot VERSION updates (the
#     "chase newest" PRs). Several deps are pinned below latest on purpose
#     (see `ignore` below), so we never want unsolicited version-bump PRs.
#   - Dependabot SECURITY updates stay active regardless of that limit. They
#     fire only on a known CVE and bump to the minimum patched version.
#   - The `groups` block batches all CVE-driven bumps into ONE pull request
#     per run instead of one PR per package.
#   - `ignore` protects intentional holds: a security bump is still blocked
#     from crossing these version boundaries. The alert stays visible in the
#     Dependabot tab; it just won't auto-open a PR that breaks a pin.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Required field. Only governs version updates, which are disabled below,
      # so this cadence is effectively inert — security updates run on detection.
      interval: "weekly"
    # 0 = no version-update PRs. Security updates are unaffected by this limit.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # (zod 3 -> 4 + drizzle-zod 0.8 landed 2026-11-09; their holds are gone.)
      # Pinned to Expo SDK 58. A transitive CVE must NOT drag expo to a new SDK
      # major (a multi-day native migration); fix such CVEs via `overrides`
      # instead. Allow 58.x patches; block the SDK 59 jump. See PR #312.
      #
      # KEEP THIS BOUNDARY IN STEP WITH THE SDK. Bump it in the same PR as every
      # SDK upgrade: a stale boundary (e.g. ">=55" while on 58) silently blocks
      # ALL security patches for the SDK we actually run — the alert shows, but
      # no PR ever opens.
      #
      # NOTE: on each SDK bump, re-evaluate the `overrides.postcss` pin in
      # package.json — if the new @expo/metro-config ships a patched postcss
      # natively, the override can go (then re-run `npm ls postcss`). Checked at
      # SDK 58: @expo/metro-config asks for postcss ^8.5.23; the override is a
      # resolution floor only and was kept. Metro doesn't call postcss unless a
      # postcss.config exists; lightningcss is the web CSS transformer. See the
      # closure note in docs/solutions/best-practices (metro-postcss-gating-…).
      - dependency-name: "expo"
        versions: [">=59.0.0"]
      # The OCR library, held on 5.x. (The 6.0.0 this entry was written for was
      # never published — npm has only 1.1.0 and 5.0.1 — and its stated blocker,
      # the iOS 16.4 deployment target, is already met.) The boundary stays
      # because any major of a native module can break at NATIVE BUILD time,
      # not at `npm install`, and CI has no native build step.
      # `open-pull-requests-limit: 0` already blocks version updates, but
      # SECURITY updates bypass that limit — hence a version boundary too.
      #
      # NOTE: this package is deliberately unpinned at the CocoaPods layer
      # (`s.dependency 'GoogleMLKit/TextRecognition'`, no version). That is what
      # lets GoogleMLKit float to whatever root the barcode scanner needs, and
      # is why replacing @react-native-ml-kit/text-recognition unblocked the
      # VisionCamera upgrade. Do not "fix" it by pinning GoogleMLKit.
      - dependency-name: "@infinitered/react-native-mlkit-text-recognition"
        versions: [">=6.0.0"]
