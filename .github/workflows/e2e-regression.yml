# E2E Regression (Maestro)
#
# Nightly scheduled regression run (plus manual `workflow_dispatch`) of the
# critical Maestro flows — tagged `regression` — on BOTH an iOS simulator and
# an Android emulator. Flow inventory and coverage gaps: e2e/README.md → CI.
#
# Trigger decision (2026-07 — see todos/archive/P3-2026-07-09-e2e-regression-gating-maestro.md):
#
#   SCHEDULED, NOT PR-GATED. E2E runs are slow (~30-45 min of native build +
#   simulator boot) and inherently flakier than unit tests; gating merges on an
#   unproven suite would erode trust in required checks and add that latency to
#   every PR. A nightly run catches regressions within a day of merge without
#   blocking anyone. PR-gating stays a deliberate LATER step, to be revisited
#   only once the nightly flake rate is proven low — and if it ever happens it
#   must be a separate, clearly-labelled required check, never folded into the
#   fast lint/type/test preflight path that gates PRs today.
#
#   This workflow is intentionally NOT in the branch-protection required-check
#   list; a red run never blocks a merge. GitHub's scheduled-workflow failure
#   notifications and the Actions tab are NOT relied on (34 straight failures
#   went unnoticed for a month under that assumption) — a failed run instead
#   files/updates a GitHub Issue labelled `e2e-regression-failure` via the
#   `notify-on-failure` job below, so a red night is visible in the Issues tab.
#
#   Cost note: the repo is public, so standard GitHub-hosted runners — including
#   macOS — are free; the previous "manual-only to save paid macOS minutes"
#   rationale no longer applies.
#
# Flake tolerance: the Maestro step retries once before failing the job, so a
# single transient flake doesn't produce a red night. A flow that fails twice
# in a row is a real signal.
#
# Status (2026-08-30): NIGHTLY SCHEDULE PAUSED. `main` is still on the
# never-passed state (34/34, then N more nights after that) while the actual
# fix iterates on branches — see
# todos/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md (structural
# session/clearState bug: fixed and cross-platform confirmed on its branch,
# not yet merged) and
# todos/P2-2026-08-30-e2e-flow-assertions-dont-match-app-ui.md (remaining
# flow-content failures, split off once the above landed). Every nightly
# `schedule` run against unfixed `main` was failing 100% of the time and
# firing both a workflow-failure notification and a new comment on GitHub
# Issue #832 EVERY NIGHT with zero new information each time — pure noise,
# not a monitoring signal. Paused the `schedule` trigger below rather than
# let that continue during active iteration; `workflow_dispatch` is
# unaffected, so CI iteration on fix branches continues normally.
# RE-ENABLE the `schedule:` block below once either todo above lands a
# genuinely green `workflow_dispatch` run on `main`.

name: E2E Regression

on:
  # schedule:
  #   # Nightly at 08:17 UTC (~00:17 PT). Off-hour minute avoids GitHub's
  #   # top-of-the-hour scheduler congestion. Scheduled runs execute against
  #   # the default branch (main) — this catches regressions after merge; it
  #   # does not block them (see trigger decision above).
  #   - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-ios:
    name: Maestro regression (iOS simulator)
    runs-on: macos-15
    # 60min was insufficient once Maestro flows finally started executing
    # (dispatch 8, run 33287752221): ~24min in, still mid-retry, cut off by
    # this timeout before printing a real Flows-Passed/Failed summary for
    # the retry pass. Re-bumped 90 -> 110 when the launch readiness gate grew
    # 120s -> 240s (run 33341123446's 177.7s cold bundle): degenerate worst
    # case is 16 flow-invocations x ~240s gate = ~64m + ~25m build/setup,
    # which 90 no longer covers with margin. The point of the headroom is a
    # real Pass/Fail summary instead of an ambiguous timeout.
    timeout-minutes: 110

    env:
      # Backend env — mirrors .github/workflows/ci.yml so the server behaves the
      # same here. The flows hit the backend (login needs a real user; most
      # flows need a logged-in session), so the API must be up.
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"
      # The suite reloads the app once per flow and logs in after each UI
      # logout — that legitimately exceeds the production rate-limit ceilings
      # (login/subscription at 10/15min). Relaxes factory-created limiters
      # ×1000 (still bounded); the knob is refused when NODE_ENV=production.
      E2E_RELAXED_RATE_LIMITS: "true"
      # Maestro's XCUITest driver readiness budget (default 120000 = 120s,
      # polling the runner's /status every 500ms). Run 33348888795 blew the
      # default — "IOSDriverTimeoutException: iOS driver not ready in time" —
      # on a contended runner where driver bring-up also competed with the
      # cold Metro bundle; the exception text itself recommends raising this.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      # Credentials consumed by the Maestro flows (see e2e/README.md).
      USERNAME: testuser
      PASSWORD: testpass123
      # sentry-cli's source-map upload build phase fails hard in CI with "An
      # organization ID or slug is required" — no Sentry org/auth token is
      # configured here (this is a throwaway E2E build, not a release).
      # ALLOW_FAILURE (not DISABLE_AUTO_UPLOAD) so the phase still runs and
      # fails soft, surfacing any *other* problem in it instead of masking
      # the phase entirely.
      SENTRY_ALLOW_FAILURE: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macos-14 (Xcode 15.4 default, 16.1/16.2 available) was the previous
      # pin, chosen only to clear RN 0.81's own >=16.1 floor -- but this
      # repo's native config (the fmt/consteval Podfile patch, the
      # nitrogen-C++-interop-ICE SWIFT_COMPILATION_MODE workaround) is
      # written for and already assumes Xcode 26, not 16.x. Building against
      # 16.2 anyway surfaced a cascade of SDK-ceiling errors with no natural
      # end (CxxStdlib's iOS-16 minimum, expo-notifications' iOS-26-gated
      # isRepeatedDay, vision-camera's kCVPixelFormatType_96VersatileBayerPacked12,
      # a swift-frontend ICE in NitroImage's codegen script) -- each one a
      # real, permanent repo patch bought to accommodate a runner choice, not
      # an actual product need. macos-15 ships Xcode 26.3 alongside 16.x,
      # matching what the rest of this repo already targets -- select that
      # instead of continuing to patch around 16.2's gap.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # macOS runners do NOT ship a startable Postgres — install it explicitly
      # (matches the Postgres 16 used by the Android job's service container and
      # ci.yml), then start it and provision the role + database the server
      # expects. postgresql@16 is keg-only, so its bin/ isn't on PATH by default.
      - name: Start Postgres
        run: |
          brew install postgresql@16
          PG_PREFIX="$(brew --prefix postgresql@16)"
          export PATH="$PG_PREFIX/bin:$PATH"
          brew services start postgresql@16
          for i in $(seq 1 30); do
            if pg_isready -q; then break; fi
            sleep 2
          done
          createuser -s ocrecipes || true
          psql -d postgres -c "ALTER USER ocrecipes WITH PASSWORD 'ocrecipes';"
          createdb -O ocrecipes ocrecipes_test || true
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      # curl installer is faster and avoids brew rate limits on a cold runner.
      # Pinned: the installer otherwise resolves "latest" per run, so the
      # driver/CLI under test could silently change between dispatches
      # (2.9.0 is what every 2026-08-30/31 run, green and red, used).
      # Bump deliberately, with a dispatch, not by drift.
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.9.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Boot an iOS simulator for Maestro to drive. macos-15 ships Xcode with
      # iPhone simulators preinstalled -- "iPhone 15" (used under the prior
      # macos-14/Xcode 16.2 pin) doesn't exist in Xcode 26.x's default
      # simulator lineup, which starts at "iPhone 16" (confirmed empirically:
      # run 33283020295 failed here with "Invalid device: iPhone 15" once
      # every earlier layer was already cleared by the runner-image switch).
      # Export the resolved UDID so the failure-diagnostic step below can
      # target the exact same device by id (a name-based -destination lookup
      # is ambiguous across the multiple "iPhone 16" runtimes the image ships
      # and can itself fail to resolve).
      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b
          UDID="$(xcrun simctl list devices booted -j | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const devices of Object.values(data.devices)) {
              const match = devices.find((d) => d.name === "iPhone 16" && d.state === "Booted");
              if (match) { console.log(match.udid); process.exit(0); }
            }
            process.exit(1);
          ')"
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      # Start the backend the flows talk to; keep it running for the rest of the job.
      - name: Start backend
        run: |
          npm run server:dev > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health >/dev/null 2>&1 || { echo "::error::backend did not become ready within 60s"; cat server.log; exit 1; }

      # helpers/login.yaml's ${USERNAME}/${PASSWORD} need this account to
      # actually exist — nothing else in this job creates it. `|| true` only
      # covers an idempotent re-run within the same job (the retry below);
      # each workflow run gets a fresh Postgres instance.
      - name: Seed E2E test user
        run: |
          # Fail LOUD: bare `curl -sf` under this shell's `-eo pipefail`
          # aborts with an opaque exit code and no body. Register may 409 on
          # an already-seeded rerun — only a failed login is fatal.
          REG_BODY=$(curl -s -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\",\"email\":\"${USERNAME}@example.com\",\"ageConfirmed\":true}") \
            || REG_BODY="(register curl itself failed)"
          # Mark onboarding complete so a session that persists across a
          # Maestro flow's app relaunch lands on the known, testable Main app
          # instead of the onboarding wizard (flows reach a logged-out state
          # via the UI Sign Out in e2e/helpers/ensure-logged-out.yaml —
          # launchApp/clearState is banned in this suite, see e2e/README.md).
          # login.yaml's idempotency handles the "already authenticated,
          # Sign In never appears" case this produces.
          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Seed login for $USERNAME failed — the suite cannot run without this account. Register response (token stripped):"
            echo "$REG_BODY" | jq -c 'del(.token)' 2>/dev/null || echo "$REG_BODY"
            exit 1
          fi
          PROF_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://localhost:3000/api/auth/profile \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"onboardingCompleted":true}')
          if [ "$PROF_CODE" != "200" ]; then
            echo "::error::Seed profile update returned HTTP $PROF_CODE — $USERNAME would land in the onboarding wizard"
            exit 1
          fi
          echo "seeded $USERNAME (onboardingCompleted=true)"

      # The debug build is a dev client that loads its JS bundle from Metro, so
      # Metro must be running for the app to render anything Maestro can drive.
      # EXPO_PUBLIC_DOMAIN is deliberately unset: the client falls back to
      # http://localhost:3000, which reaches the backend above from the simulator.
      - name: Start Metro bundler
        run: |
          npx expo start --port 8081 > metro.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/status >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8081/status >/dev/null 2>&1 || { echo "::error::Metro did not become ready within 60s"; cat metro.log; exit 1; }

      # Build the native iOS app and install it on the booted simulator.
      # --no-bundler because Metro is already running in the background above.
      # Retried once: run 33345540597 died here AFTER a successful build+
      # install when the final `xcrun simctl openurl` launch timed out
      # (NSPOSIXErrorDomain code 60) — a one-off simulator stall that cost a
      # whole dispatch. In that failure mode the retry reuses warm
      # DerivedData (~2-3 min; an earlier-stage failure retries whatever it
      # actually costs — pod resolution reruns either way); a genuine build
      # failure still fails both attempts, so the raw-xcodebuild diagnostic
      # step below keeps its trigger semantics. The step-level bound covers
      # BOTH attempts (cold build ~17-20m + a retry) so a wedged retry fails
      # cleanly into the diagnostic step instead of silently consuming the
      # job's 110m budget (which cancels the run with no Pass/Fail summary).
      - name: Build and install iOS app
        id: build-ios
        timeout-minutes: 35
        run: |
          npx expo run:ios --no-bundler || {
            echo "::warning::expo run:ios failed once - retrying (see run 33345540597 simctl-openurl timeout)"
            sleep 20
            npx expo run:ios --no-bundler
          }

      # `expo run:ios` wraps xcodebuild in its own formatter, which can swallow
      # the actual error — its own failure message admits this ("try building
      # the app with Xcode directly"). On failure, re-invoke xcodebuild
      # directly (no wrapper) so the raw compiler/linker output reaches the
      # log. DerivedData is already warm from the attempt above, so this only
      # redoes the work needed to reach the same failure, not a full rebuild
      # — bounded separately in case that assumption is wrong (e.g. the real
      # failure was upstream of the build step, so DerivedData was never
      # populated and this would otherwise attempt a full cold build inside
      # the job's remaining time budget).
      #
      # Gated on the build step's own outcome, not job-wide `if: failure()`:
      # a job-wide gate would also fire (and burn job-timeout budget) on an
      # unrelated earlier failure (Postgres, Metro, simulator boot), where
      # $IOS_SIMULATOR_UDID may not even be set.
      - name: Diagnose iOS build failure (raw xcodebuild output)
        if: failure() && steps.build-ios.outcome == 'failure'
        working-directory: ios
        timeout-minutes: 15
        run: |
          xcodebuild -workspace OCRecipes.xcworkspace -configuration Debug -scheme OCRecipes \
            -destination "id=$IOS_SIMULATOR_UDID" build 2>&1

      # Pre-warm Metro's dev-client bundle BEFORE the first flow. The cold
      # bundle (177.7s in run 33341123446 under runner contention) otherwise
      # runs concurrently with Maestro's XCUITest driver bring-up AND the first
      # flow's launch gate — two budgets racing one CPU-starved bundler. The
      # URL is exactly what the dev client's manifest advertises as
      # launchAsset.url (Metro's transform cache is per-file, so even a param
      # mismatch would still warm the expensive part). Best-effort by design:
      # the launch gate keeps owning the cold-start budget if this times out.
      - name: Pre-warm Metro bundle
        run: |
          curl -sf -o /dev/null --max-time 600 \
            "http://localhost:8081/client/index.bundle?platform=ios&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=app&transform.reactCompiler=true&unstable_transformProfile=hermes-stable" \
            && echo "Metro bundle is warm" \
            || echo "::warning::Metro pre-warm did not complete within 600s — continuing (launch gate still owns cold start)"

      # Runs `maestro test --include-tags regression e2e/` (see e2e/README.md for
      # the tagged flow inventory). One retry absorbs a transient flake; two
      # consecutive failures fail the job.
      - name: Run Maestro regression flows
        run: |
          npm run e2e:regression || {
            echo "::warning::Maestro regression flows failed once — retrying"
            npm run e2e:regression
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-ios
          path: |
            server.log
            metro.log
            e2e/maestro-output/
          if-no-files-found: warn

  e2e-android:
    name: Maestro regression (Android emulator)
    runs-on: ubuntu-latest
    # Bumped from 60 (2026-08-29, run 33280577594): the job was killed by
    # this exact timeout at 60m03s with Android still mid-retry -- a
    # *timeout*, not a real result, so it couldn't say whether the
    # Continue-overlay wait fix (e2e/helpers/launch-app.yaml) actually
    # works. Re-bumped 90 -> 110 when the launch readiness gate grew
    # 120s -> 240s: degenerate worst case is ~17m native build + 16
    # flow-invocations x ~240s gate + overhead = ~85m+, leaving 90 without
    # margin. 110 keeps the property the original bump bought: reach an
    # actual Pass/Fail summary instead of another ambiguous timeout.
    timeout-minutes: 110

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"
      # See the iOS job's note — the suite's per-flow reload + relogin
      # pattern exceeds production rate-limit ceilings.
      E2E_RELAXED_RATE_LIMITS: "true"
      USERNAME: testuser
      PASSWORD: testpass123

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      # Pinned: the installer otherwise resolves "latest" per run, so the
      # driver/CLI under test could silently change between dispatches
      # (2.9.0 is what every 2026-08-30/31 run, green and red, used).
      # Bump deliberately, with a dispatch, not by drift.
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.9.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ubuntu-latest runners support hardware acceleration for the Android
      # emulator, but /dev/kvm is not accessible by default.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start backend
        run: |
          npm run server:dev > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health >/dev/null 2>&1 || { echo "::error::backend did not become ready within 60s"; cat server.log; exit 1; }

      # See the iOS job's "Seed E2E test user" note — same reason, same account.
      - name: Seed E2E test user
        run: |
          # Fail LOUD: bare `curl -sf` under this shell's `-eo pipefail`
          # aborts with an opaque exit code and no body. Register may 409 on
          # an already-seeded rerun — only a failed login is fatal.
          REG_BODY=$(curl -s -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\",\"email\":\"${USERNAME}@example.com\",\"ageConfirmed\":true}") \
            || REG_BODY="(register curl itself failed)"
          # Mark onboarding complete so a session that persists across a
          # Maestro flow's app relaunch lands on the known, testable Main app
          # instead of the onboarding wizard (flows reach a logged-out state
          # via the UI Sign Out in e2e/helpers/ensure-logged-out.yaml —
          # launchApp/clearState is banned in this suite, see e2e/README.md).
          # login.yaml's idempotency handles the "already authenticated,
          # Sign In never appears" case this produces.
          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Seed login for $USERNAME failed — the suite cannot run without this account. Register response (token stripped):"
            echo "$REG_BODY" | jq -c 'del(.token)' 2>/dev/null || echo "$REG_BODY"
            exit 1
          fi
          PROF_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://localhost:3000/api/auth/profile \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"onboardingCompleted":true}')
          if [ "$PROF_CODE" != "200" ]; then
            echo "::error::Seed profile update returned HTTP $PROF_CODE — $USERNAME would land in the onboarding wizard"
            exit 1
          fi
          echo "seeded $USERNAME (onboardingCompleted=true)"

      # See the iOS job's Metro note. On Android the emulator's localhost is the
      # emulator itself, so `adb reverse` (below) tunnels the app's
      # localhost:8081 (Metro) and localhost:3000 (backend) back to the host.
      - name: Start Metro bundler
        run: |
          npx expo start --port 8081 > metro.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/status >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8081/status >/dev/null 2>&1 || { echo "::error::Metro did not become ready within 60s"; cat metro.log; exit 1; }

      # Boots the emulator, then builds + installs the app and runs the flows
      # against it. Same regression tag set and retry policy as the iOS job.
      #
      # reactivecircus/android-emulator-runner executes `script:` ONE LINE PER
      # `sh -c` INVOCATION (verified against run 31874413569's logs — each line
      # gets its own separate `[command]/usr/bin/sh -c <line>`). A multi-line
      # `||  { ...; }` retry construct therefore cannot survive here: the `{`
      # opens a group its own single-line shell never sees the closing `}` for.
      # The retry must stay on one line — do not reformat this back to a
      # multi-line block.
      - name: Build app and run Maestro regression flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:8081 tcp:8081
            npx expo run:android --no-bundler
            npm run e2e:regression || { echo "::warning::Maestro regression flows failed once — retrying"; npm run e2e:regression; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-android
          path: |
            server.log
            metro.log
            e2e/maestro-output/
          if-no-files-found: warn

  # A red run that no one reads is not a signal (see docs/solutions/best-practices/
  # a-ci-job-neither-required-nor-watched-is-invisible-2026-08-15.md). This job
  # files or updates a single GitHub Issue on failure so it shows up in the
  # Issues tab instead of relying on the Actions tab or scheduled-workflow email,
  # neither of which anyone was actually watching (that's how this workflow
  # reached 34/34 failures unnoticed). No new secrets — uses the default
  # GITHUB_TOKEN via actions/github-script.
  notify-on-failure:
    name: Notify on regression failure
    needs: [e2e-ios, e2e-android]
    if: always() && (needs.e2e-ios.result == 'failure' || needs.e2e-android.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        env:
          IOS_RESULT: ${{ needs.e2e-ios.result }}
          ANDROID_RESULT: ${{ needs.e2e-android.result }}
        with:
          script: |
            const label = 'e2e-regression-failure';
            const title = 'E2E Regression: nightly run failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The E2E Regression workflow failed.',
              '',
              `- iOS job: ${process.env.IOS_RESULT}`,
              `- Android job: ${process.env.ANDROID_RESULT}`,
              `- Run: ${runUrl}`,
              '',
              'This issue is updated automatically on each subsequent failure. Close it once the suite is green again.',
            ].join('\n');

            // Ensure the label exists before filtering/creating with it — the
            // Issues API does not reliably auto-create an unknown label.
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'd73a4a' });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            // Match by title, not just the label, in case the label is ever reused.
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
