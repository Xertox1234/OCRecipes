name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "todos/**"
  pull_request:
    branches: ["**"]
  schedule:
    # Nightly unsharded outward-CLI corpus run (drift backstop for the sharded
    # path below) at a quiet UTC hour. Scheduled workflows only ever run
    # against the default branch's tip -- see the corpus-nightly job.
    - cron: "17 7 * * *"

concurrency:
  # event_name is part of the group so a push to main can never cancel an
  # in-flight nightly run (they land in different groups) -- see the
  # CANCEL-IN-PROGRESS RESIDUAL note above the outward-CLI corpus job graph.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Types · Patterns
    runs-on: ubuntu-latest
    # Scheduled runs exist only to drive corpus-nightly; every other job here
    # would otherwise re-run the whole CI suite nightly for no reason.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run check:format

      - name: ESLint suppressions are pruned
        run: npm run lint:suppress:check

      - name: Type check
        run: npm run check:types

      - name: Accessibility patterns
        run: node scripts/check-accessibility.js

      - name: Hardcoded colors
        run: node scripts/check-hardcoded-colors.js

      - name: BottomSheetModal BackHandler wiring
        run: node scripts/check-bottomsheet-backhandler.js

      - name: IDOR storage check
        run: node scripts/check-idor-storage.js

      - name: JSDOM pragma check
        run: node scripts/check-jsdom-pragma.js

      - name: Rules file size cap (docs/rules/*.md)
        run: node scripts/check-rules-file-size.js

      # Whole-corpus mode (no args). Gates the docs/solutions frontmatter contract,
      # including routing reachability (tags must match a routed domain — PR #800);
      # the pre-existing violator backlog was cleared in PR #801, so this holds at zero.
      - name: Solution frontmatter contract (docs/solutions, whole corpus)
        run: node scripts/check-solution-frontmatter.js

      - name: Verify .github/copilot-instructions.md is current
        run: npm run build:copilot-instructions:check

      # Single source shared with scripts/preflight.sh (full mode): the glob loop, git-env
      # strip, per-test fail-fast, and zero-count guard all live in scripts/run-hook-tests.sh,
      # so this step and preflight can't drift. Add or rename hooks there, not here.
      - name: Hook self-tests (.claude/hooks/test-*.sh)
        run: bash scripts/run-hook-tests.sh

  # ---------------------------------------------------------------------------------------
  # Outward-CLI guard corpus: detect / shard / aggregate / status job graph.
  #
  # The corpus is the outward-CLI guard's executable ground truth (currently 2160
  # constructions x 4 execution paths -- precise / no-jq / no-lib / no-awk) and pins
  # guard-outward-cli.sh's per-row verdicts and deny-site attribution; nothing else in
  # CI runs it (scripts/run-hook-tests.sh globs `.claude/hooks/test-*.sh`, and this
  # script's filename deliberately does not match -- see
  # todos/P2-2026-09-07-repro-corpus-never-runs-in-ci-and-has-no-pin.md). It has been
  # ONE OF MAIN'S REQUIRED CHECKS since 2026-09-08: a red corpus BLOCKS every merge, so
  # a careless edit to .claude/hooks/** can wedge the repository -- mutation-verify
  # before pushing.
  #
  # WHY FOUR JOBS INSTEAD OF ONE: as a single always-on job the corpus ran 17-27 minutes
  # on EVERY pull_request push, including docs-only ones that cannot change a verdict
  # (measured on PR #1013 -- see the MEASURED note at the bottom). `corpus-detect`
  # decides, from the actual diff, whether this push could touch a verdict;
  # `corpus-shard` runs the corpus across a parallel matrix ONLY when detect says yes;
  # `corpus-aggregate` re-derives every pin (row count, both gap totals, both per-ID
  # manifests, deny-site attribution) from the UNION of the shards' output -- never
  # per-shard, since a per-shard total pin is meaningless; and the `outward-cli-corpus`
  # job below is a small always-on status job reporting the combined result under the
  # SAME required-check name the single-job shape used.
  #
  # *** THE `name:` ON THE `outward-cli-corpus` JOB BELOW IS AN API CONTRACT. DO NOT PUT
  # A CHANGING VALUE IN IT. *** Branch protection stores the required check as an exact
  # STRING ("Outward-CLI guard corpus") and matches on it -- a renamed job does not fail
  # the requirement, it never satisfies it, so the check sits permanently "expected" and
  # NOTHING can merge. Not hypothetical: this name once read "(427 rows x 4 paths)", the
  # corpus grew, the name was updated to match, and PR #935 was refused with `Required
  # status check "Outward-CLI guard corpus (427 rows x 4 paths)" is expected`. That is
  # why the row count now lives only in this comment, never in the `name:`, and why this
  # PR reuses the exact same string and does NOT touch branch protection. If the name
  # ever MUST change: push the rename, PATCH /branches/main/protection/required_status_checks
  # (the narrow sub-resource -- the top-level /protection endpoint REPLACES the whole
  # config and would silently drop enforce_admins and the PR-review requirement), then
  # merge, with the PR queue empty in between.
  #
  # PASS CONDITION (implemented in the `outward-cli-corpus` job's single step): detect
  # must have SUCCEEDED, and either detect said run=false (nothing relevant changed) or
  # aggregate SUCCEEDED. `skipped` is never treated as a pass by itself -- a job skipped
  # because an upstream job FAILED reports the same "skipped" as one skipped by design,
  # so the status step reads the literal `result` strings and the literal `run` value,
  # failing closed if `run` is anything other than exactly "true" or "false".
  #
  # TWO DIFFERENT KINDS OF "SKIPPED", DO NOT CONFUSE THEM: a JOB skipped by a job-level
  # `if` (corpus-shard/corpus-aggregate when detect says run=false) reports "success" to
  # branch protection and does not block merging. A WHOLE WORKFLOW skipped by path
  # filters is different -- GitHub never sends a status for it, so an associated
  # required check stays "Pending" forever and blocks merging ("Avoid requiring
  # workflows that can be skipped") -- see
  # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  # That is exactly why the required check lives on the always-on `outward-cli-corpus`
  # status job (`if: always()`) rather than on `corpus-detect`/`corpus-shard`/
  # `corpus-aggregate` directly -- those jobs skip by design in the no-op case.
  #
  # "Every `.claude/hooks/**` edit triggers the corpus" still holds: corpus-detect diffs
  # the PR (or, on push, always runs it) and matches
  # `^(\.claude/hooks/|\.github/workflows/ci\.yml$)`. "Every push does" no longer holds:
  # a push/PR touching neither path makes corpus-detect emit run=false, corpus-shard/
  # corpus-aggregate report skipped, and no corpus runner minutes are spent at all --
  # only corpus-detect's own quick diff-and-grep runs.
  #
  # NIGHTLY BACKSTOP: `corpus-nightly` (below, after this job graph) runs the ORIGINAL
  # no-arg, unsharded script on `on.schedule` (default-branch only -- scheduled
  # workflows only ever run against the default branch's tip) as the drift check: a
  # sharding bug that silently dropped a slice would otherwise read as green forever on
  # the sharded path alone. VISIBILITY: per
  # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule ,
  # GitHub Actions sends scheduled-workflow failure notifications to the user who LAST
  # MODIFIED THE CRON SYNTAX in the workflow file -- i.e. whoever next edits the
  # `cron:` line under `on:` above inherits being the notified party. Nothing else
  # watches this job: it is not a required check (a schedule event carries no PR to
  # gate), so a silent nightly failure is caught only by that one person noticing the
  # notification.
  #
  # CANCEL-IN-PROGRESS RESIDUAL: concurrency.cancel-in-progress is still on, now scoped
  # by `${{ github.event_name }}` too so a push to main cannot cancel an in-flight
  # nightly run (different groups). Within one event kind, a superseded run can still
  # cancel an in-flight corpus-shard leg; that leaves corpus-aggregate missing one
  # shard's artifact, and its own id-set/row-count check (the union must cover
  # EXPECTED_ROWS exactly, not just "no shard reported failure") fails closed, so the
  # status job blocks. Same safe direction as the single-job shape had.
  #
  # No setup-node and no `npm ci` on any of these jobs -- unchanged from the single-job
  # shape: neither guard-outward-cli.sh nor .claude/hooks/lib/* invokes node, npx or
  # git-as-a-tool (every `git` occurrence in the guard is a regex matching analysed
  # TEXT, so verdicts cannot vary with the runner's detached HEAD). The corpus needs
  # only bash, coreutils and jq -- all present on ubuntu-latest.
  #
  # MEASURED (single-job shape, retired by this PR): 2031 rows finished in 17m25s in CI
  # (run 35298588804); the corpus later grew to its current 2160 rows and completed in
  # 22m40s and 26m32s on two further CI runs this month. 30-minute cap: an earlier,
  # smaller corpus at 1967 rows was KILLED at the then-20-minute cap -- runner-to-runner
  # variance dominates the row-count effect, so the cap budgets for variance, not for
  # headroom to add rows.
  # Sharded wall time (N=4): TO BE MEASURED on this PR's CI runs.
  # ---------------------------------------------------------------------------------------
  corpus-detect:
    name: Outward-CLI corpus relevance check
    runs-on: ubuntu-latest
    # Cheap and on-theme for a merge-latency-focused PR: this job feeds the
    # required check via a full-history checkout + diff, so a hung fetch
    # should not leave that check pending for GitHub's 360-minute default.
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the merge-base for the three-dot diff below

      - name: Detect .claude/hooks/** or ci.yml changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              # FAIL LOUD, never fail-open: resolve the diff in its own statement
              # so a git error (missing SHA / no merge-base) fails this required
              # gate instead of being swallowed and defaulting to a false "skip".
              git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
              git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null
              # three-dot = merge-base..head, so a moved base branch does not pull
              # in unrelated upstream changes (same rule as mutation-goal-safety.yml).
              CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
              echo "Changed files in this PR:"
              echo "$CHANGED"
              # Here-string, NOT a pipe into grep -q: under `set -o pipefail`,
              # grep -q closes the pipe on first match and the upstream command
              # can take SIGPIPE, which would flip this required gate to fail-open.
              if grep -qE '^(\.claude/hooks/|\.github/workflows/ci\.yml$)' <<< "$CHANGED"; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              # push to main is the only run against the real merged tree: branch
              # protection's required-checks setting is strict:false, so a PR's
              # green corpus run can predate main's current tip -- always run.
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              # corpus-nightly (below) is the drift backstop for schedule events;
              # the sharded path does not also need to run.
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  corpus-shard:
    name: Outward-CLI corpus (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: corpus-detect
    if: needs.corpus-detect.outputs.run == 'true'
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5

      - name: Guard corpus shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          bash .claude/hooks/repro-outward-cli-corpus.sh \
            --shard ${{ matrix.shard }}/${{ strategy.job-total }} \
            --out corpus-shard-${{ matrix.shard }}.rec

      - name: Upload shard records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-shard-${{ matrix.shard }}
          path: corpus-shard-${{ matrix.shard }}.rec
          retention-days: 3
          if-no-files-found: error

  corpus-aggregate:
    name: Outward-CLI corpus aggregate + pin
    runs-on: ubuntu-latest
    needs: [corpus-detect, corpus-shard]
    if: always() && needs.corpus-detect.outputs.run == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # aggregate reads the guard source (_pin_sites)

      - name: Download shard records
        uses: actions/download-artifact@v8
        with:
          pattern: corpus-shard-*
          merge-multiple: true
          path: corpus-shards/

      - name: Aggregate + pin (rows, gap totals, per-ID manifests, deny-site attribution)
        # Deliberately not gated on needs.corpus-shard.result: a cancelled or
        # otherwise-incomplete shard leg is caught here instead, by the union
        # failing to cover EXPECTED_ROWS -- that id-set check is the integrity
        # guarantee, not the upstream job's own conclusion. See the block above.
        run: bash .claude/hooks/repro-outward-cli-corpus.sh --aggregate corpus-shards

  outward-cli-corpus:
    name: Outward-CLI guard corpus
    runs-on: ubuntu-latest
    needs: [corpus-detect, corpus-aggregate]
    if: always()
    steps:
      - name: Evaluate corpus-detect + corpus-aggregate results
        env:
          DETECT_RESULT: ${{ needs.corpus-detect.result }}
          DETECT_RUN: ${{ needs.corpus-detect.outputs.run }}
          AGGREGATE_RESULT: ${{ needs.corpus-aggregate.result }}
        run: |
          set -euo pipefail
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "corpus-detect did not succeed (result: $DETECT_RESULT)" >&2
            exit 1
          fi
          case "$DETECT_RUN" in
            true)
              if [ "$AGGREGATE_RESULT" != "success" ]; then
                echo "corpus-detect requested a run (run=true) but corpus-aggregate did not succeed (result: $AGGREGATE_RESULT)" >&2
                exit 1
              fi
              ;;
            false)
              : # nothing relevant changed; corpus-shard/corpus-aggregate skipped by design
              ;;
            *)
              echo "corpus-detect produced an invalid run output: '$DETECT_RUN' (expected exactly 'true' or 'false')" >&2
              exit 1
              ;;
          esac
          echo "Outward-CLI guard corpus: pass (detect=$DETECT_RESULT run=$DETECT_RUN aggregate=$AGGREGATE_RESULT)"

  # Nightly drift backstop: the ORIGINAL no-arg, unsharded script, run once a day
  # against main regardless of what changed. See the corpus-detect block above for
  # why this exists and who is notified on failure.
  corpus-nightly:
    name: Outward-CLI guard corpus (nightly, unsharded)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Guard corpus + pin (rows, gap totals, per-ID manifests)
        run: bash .claude/hooks/repro-outward-cli-corpus.sh

  test:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      # Stub external APIs so tests never hit real endpoints
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Tests
        run: npm run test:run -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  integration-http:
    name: Real-DB HTTP integration (auth) — advisory
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'schedule'
    # Advisory only — deliberately NOT added to required status checks in
    # branch protection (that omission, not continue-on-error, is what keeps
    # it non-blocking: a job's pass/fail can only gate a merge if a human
    # adds its name to the required-checks list). See test/integration/
    # README.md: this suite drives real Postgres + real bcrypt (slower, more
    # flakiness-prone than the mocked unit/route suite), so it stays out of
    # the required/fast gates. It still runs automatically on every push/PR,
    # with its real pass/fail fully visible in the PR checks list, so an
    # auth-wiring regression is caught on the push that introduces it — not
    # only when a developer remembers to run it locally.
    #
    # Deliberately NOT continue-on-error: true — at the job level that
    # reports job.result as "success" even when a step failed (only the
    # workflow-run conclusion still reflects the failure), which would make
    # a real regression here read as green/passing rather than visibly
    # failed. A plain job with real red/green status, simply absent from the
    # required-checks list, is the unambiguous way to be "visible but
    # non-blocking."

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Real-DB HTTP integration tests
        run: npm run test:integration:http

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Tests (with coverage)
        run: npm run test:coverage:ci
