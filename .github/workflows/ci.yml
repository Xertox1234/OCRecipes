name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "todos/**"
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Types · Patterns
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run check:format

      - name: ESLint suppressions are pruned
        run: npm run lint:suppress:check

      - name: Type check
        run: npm run check:types

      - name: Accessibility patterns
        run: node scripts/check-accessibility.js

      - name: Hardcoded colors
        run: node scripts/check-hardcoded-colors.js

      - name: BottomSheetModal BackHandler wiring
        run: node scripts/check-bottomsheet-backhandler.js

      - name: IDOR storage check
        run: node scripts/check-idor-storage.js

      - name: JSDOM pragma check
        run: node scripts/check-jsdom-pragma.js

      - name: Rules file size cap (docs/rules/*.md)
        run: node scripts/check-rules-file-size.js

      # Whole-corpus mode (no args). Gates the docs/solutions frontmatter contract,
      # including routing reachability (tags must match a routed domain — PR #800);
      # the pre-existing violator backlog was cleared in PR #801, so this holds at zero.
      - name: Solution frontmatter contract (docs/solutions, whole corpus)
        run: node scripts/check-solution-frontmatter.js

      - name: Verify .github/copilot-instructions.md is current
        run: npm run build:copilot-instructions:check

      # Single source shared with scripts/preflight.sh (full mode): the glob loop, git-env
      # strip, per-test fail-fast, and zero-count guard all live in scripts/run-hook-tests.sh,
      # so this step and preflight can't drift. Add or rename hooks there, not here.
      - name: Hook self-tests (.claude/hooks/test-*.sh)
        run: bash scripts/run-hook-tests.sh

  # The outward-CLI guard's executable ground truth: 427 constructions x 4 execution
  # paths (precise / no-jq / no-lib / no-awk). Nothing ran this file until 2026-09-07 --
  # scripts/run-hook-tests.sh globs `.claude/hooks/test-*.sh` and the corpus's filename
  # does not match -- so its numbers drifted into prose about a program nobody executed.
  # See todos/P2-2026-09-07-repro-corpus-never-runs-in-ci-and-has-no-pin.md
  #
  # ITS OWN JOB, and the filename deliberately still NOT `test-*.sh`. Measured
  # 2026-09-07 on darwin/arm64 across four full runs: 1m56s-2m02s warm, 3m37s cold
  # (CI is always cold, so budget ~3m30s here). Against 2m18s for the entire 34-test
  # hook suite, folding the corpus into that glob would roughly DOUBLE the
  # preflight:fast hook gate, which fires on every push touching .claude/hooks/,
  # .husky/ or scripts/*.sh -- a pre-push cost for a signal that does not need to be
  # pre-push. As its own job it runs concurrently with the test shards, so it adds
  # ~no CI wall-clock.
  #
  # NOT one of main's eight required checks as shipped, so a red corpus REPORTS on the
  # PR but does not yet BLOCK a merge. Making it blocking is a one-line
  # branch-protection change, deliberately left to a human; the always-on shape above
  # is what makes it eligible (a path-filtered job could never be required).
  #
  # ALWAYS-ON, with no `paths:` filter, deliberately: a path-filtered job reports
  # "skipped" rather than "success", which would sit permanently pending if this is
  # ever added to main's required checks. Always running is a superset of "on every
  # push that touches .claude/hooks/**".
  #
  # No setup-node and no `npm ci`: neither guard-outward-cli.sh nor .claude/hooks/lib/*
  # invokes node or npx (verified 2026-09-07), and the corpus needs only bash, jq, grep,
  # sed, tr, wc, head, env and dirname -- all present on ubuntu-latest.
  #
  # The script exits non-zero on drift from its own pin: rows, both gap totals, and both
  # per-ID manifests. Running the corpus and ignoring its exit code would be worth
  # nothing -- that is precisely the bug this job closes.
  outward-cli-corpus:
    name: Outward-CLI guard corpus (427 rows x 4 paths)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Guard corpus + pin (rows, gap totals, per-ID manifests)
        run: bash .claude/hooks/repro-outward-cli-corpus.sh

  test:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: checks

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      # Stub external APIs so tests never hit real endpoints
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Tests
        run: npm run test:run -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  integration-http:
    name: Real-DB HTTP integration (auth) — advisory
    runs-on: ubuntu-latest
    needs: checks
    # Advisory only — deliberately NOT added to required status checks in
    # branch protection (that omission, not continue-on-error, is what keeps
    # it non-blocking: a job's pass/fail can only gate a merge if a human
    # adds its name to the required-checks list). See test/integration/
    # README.md: this suite drives real Postgres + real bcrypt (slower, more
    # flakiness-prone than the mocked unit/route suite), so it stays out of
    # the required/fast gates. It still runs automatically on every push/PR,
    # with its real pass/fail fully visible in the PR checks list, so an
    # auth-wiring regression is caught on the push that introduces it — not
    # only when a developer remembers to run it locally.
    #
    # Deliberately NOT continue-on-error: true — at the job level that
    # reports job.result as "success" even when a step failed (only the
    # workflow-run conclusion still reflects the failure), which would make
    # a real regression here read as green/passing rather than visibly
    # failed. A plain job with real red/green status, simply absent from the
    # required-checks list, is the unambiguous way to be "visible but
    # non-blocking."

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Real-DB HTTP integration tests
        run: npm run test:integration:http

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    needs: checks

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocrecipes
          POSTGRES_PASSWORD: ocrecipes
          POSTGRES_DB: ocrecipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ocrecipes:ocrecipes@localhost:5432/ocrecipes_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      LOG_LEVEL: silent
      AI_INTEGRATIONS_OPENAI_API_KEY: sk-stub
      USDA_API_KEY: stub
      API_NINJAS_KEY: stub
      RECEIPT_VALIDATION_STUB: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pg_trgm extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Push database schema
        run: npm run db:push

      - name: Tests (with coverage)
        run: npm run test:coverage:ci
