appId: com.ocrecipes.app
name: "Scan - Photo analysis intent selection"
tags:
  - regression
  - scan
  - photo
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Scan is not a tab — the FAB's a11y label is "Open scan menu" (icon-only
# button, ScanFAB.tsx) and it opens the SpeedDial action menu, not a screen
- tapOn: "Open scan menu"

# The menu must offer the photo-log action (a11y label on the mini-FAB) —
# this is the flow's mandatory subject
- extendedWaitUntil:
    visible: "Photo Food Log"
    timeout: 10000
- tapOn: "Photo Food Log"

# Camera permission may appear
- tapOn:
    text: "Allow"
    optional: true

# The photo intent screen requires a photo to be taken first.
# In simulator, camera is unavailable — these assertions validate the
# intent screen UI only when reachable (e.g. via gallery selection).
- extendedWaitUntil:
    visible:
      text: "Log this meal"
    timeout: 5000
    optional: true
- assertVisible:
    text: "Quick calorie check"
    optional: true
- assertVisible:
    text: "Just identify"
    optional: true

# Premium features should show lock indicator
- assertVisible:
    text: "Find recipes"
    optional: true
- assertVisible:
    text: "Scan restaurant menu"
    optional: true
