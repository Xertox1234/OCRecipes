appId: com.ocrecipes.app
name: "Scan - Barcode scanning flow"
tags:
  - regression
  - scan
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Scan is not a tab — the FAB's a11y label is "Open scan menu" (icon-only
# button, ScanFAB.tsx) and it opens the SpeedDial action menu, not a screen
- tapOn: "Open scan menu"

# The menu must actually open and offer the barcode action (a11y label on
# the mini-FAB) — this is the flow's mandatory subject
- extendedWaitUntil:
    visible: "Scan Barcode"
    timeout: 10000
- tapOn: "Scan Barcode"

# Camera permission flow — in simulator camera may not work but the
# screen must load with either a permission prompt or camera controls.
- extendedWaitUntil:
    visible:
      text: "Enable camera access"
    timeout: 5000
    optional: true

# If permission is already granted, we should see camera controls
- extendedWaitUntil:
    visible:
      text: "Take photo of food"
    timeout: 5000
    optional: true

# Check gallery button is available
- extendedWaitUntil:
    visible:
      text: "Choose photo from gallery"
    timeout: 3000
    optional: true
