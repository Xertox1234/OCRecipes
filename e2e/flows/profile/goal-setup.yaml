appId: com.ocrecipes.app
name: "Profile - Set nutrition goals"
tags:
  - profile
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- launchApp
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Navigate to Profile tab
- tapOn: "Profile"
- extendedWaitUntil:
    visible:
      text: "Nutrition Goals"
    timeout: 5000

# Open Nutrition Goals
- tapOn: "Nutrition Goals"
- extendedWaitUntil:
    visible:
      text: "Set Your Goals"
    timeout: 5000

# Fill in physical profile
- tapOn:
    id: "input-age"
    optional: true
- inputText:
    text: "30"
    optional: true

- tapOn:
    id: "input-weight"
    optional: true
- inputText:
    text: "75"
    optional: true

- tapOn:
    id: "input-height"
    optional: true
- inputText:
    text: "175"
    optional: true

# Select gender
- tapOn:
    text: "Male"
    optional: true

# Select activity level
- tapOn:
    text: "Moderately Active"
    optional: true

# Select primary goal
- tapOn:
    text: "Maintain"
    optional: true

# Verify calculate button
- assertVisible: "Calculate My Goals"
