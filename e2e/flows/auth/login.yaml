appId: com.ocrecipes.app
name: "Auth - Login flow"
tags:
  - smoke
  - regression
  - auth
---
# Launch the app, connect to Metro, and dismiss the dev-client's developer
# menu welcome overlay if it appears (see e2e/helpers/launch-app.yaml for
# the confirmed root cause)
- runFlow: ../../helpers/launch-app.yaml

# Verify login screen loads. A bare assertVisible uses Maestro's short stock
# default timeout, not e2e/helpers/login.yaml's tuned margin -- this flow
# doesn't call that helper, so it needs the same explicit wait itself (see
# that file's header for why 90s: each flow pays a full app relaunch + Metro
# cold-bundle cost under CI load, not just a quick screen transition).
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 90000

# Verify input fields are visible
- assertVisible:
    id: "input-username"
- assertVisible:
    id: "input-password"

# Enter credentials
- tapOn:
    id: "input-username"
- inputText: ${USERNAME}
- tapOn:
    id: "input-password"
- inputText: ${PASSWORD}

# Submit login
- tapOn: "Sign In"

# Verify we navigate away from login
- extendedWaitUntil:
    notVisible:
      text: "Sign In"
    timeout: 10000

# Toggle to register mode — clearState wipes the dev-launcher's remembered
# server too, so reconnect explicitly afterward (see e2e/helpers/launch-app.yaml,
# whose own header documents this exact two-step pattern)
- launchApp:
    clearState: true
- runFlow: ../../helpers/launch-app.yaml
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 90000
- tapOn: "Switch to sign up"
- assertVisible: "Create Account"

# Verify confirm password field appears
- assertVisible:
    id: "input-confirm-password"

# Toggle back to login
- tapOn: "Switch to sign in"
- assertVisible: "Sign In"
- assertNotVisible:
    id: "input-confirm-password"
