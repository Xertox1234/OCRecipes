appId: com.ocrecipes.app
name: "Auth - Login flow"
tags:
  - smoke
  - regression
  - auth
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Launch, connect to Metro, and clear any dev-client overlays / lingering
# system dialogs (see e2e/helpers/launch-app.yaml)
- runFlow: ../../helpers/launch-app.yaml

# Force a genuinely logged-out Sign In screen via the app's own Sign Out
# control — NOT `launchApp: { clearState: true }`, which is broken against
# the dev client on both platforms (see e2e/helpers/ensure-logged-out.yaml)
- runFlow: ../../helpers/ensure-logged-out.yaml

# Verify the login screen's own furniture (strings confirmed against the
# dispatch-9 hierarchy dump of this screen)
- assertVisible: "Welcome!"
- assertVisible:
    id: "input-username"
- assertVisible:
    id: "input-password"

# Toggle to register mode and back — the sign-up form must swap in a
# confirm-password field and swap it back out. The mode switch can briefly
# re-flash the splash overlay (observed locally), so wait for the settled
# form rather than snap-asserting. retryTapIfNoChange is DISABLED on these:
# Maestro's default auto-retap turns a toggle back off when its change
# detection misses the first tap (observed locally as an intermittent
# "toggle didn't happen").
- tapOn:
    text: "Switch to sign up"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "input-confirm-password"
    timeout: 15000
- assertVisible: "Create Account"
- tapOn:
    text: "Switch to sign in"
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: "input-confirm-password"
    timeout: 15000
- assertVisible: "Sign In"

# Real login as the seeded test user; the helper exits on the Home screen
# (its own "Hello.*" contract), which is this flow's success condition
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
