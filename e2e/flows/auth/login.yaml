appId: com.ocrecipes.app
name: "Auth - Login flow"
tags:
  - smoke
  - regression
  - auth
---
# Launch the app, connect to Metro, and dismiss the dev-client's developer
# menu welcome overlay if it appears (see e2e/helpers/launch-app.yaml for
# the confirmed root cause)
- runFlow: ../../helpers/launch-app.yaml

# Verify login screen loads
- assertVisible: "Sign In"

# Verify input fields are visible
- assertVisible:
    id: "input-username"
- assertVisible:
    id: "input-password"

# Enter credentials
- tapOn:
    id: "input-username"
- inputText: ${USERNAME}
- tapOn:
    id: "input-password"
- inputText: ${PASSWORD}

# Submit login
- tapOn: "Sign In"

# Verify we navigate away from login
- extendedWaitUntil:
    notVisible:
      text: "Sign In"
    timeout: 10000

# Toggle to register mode — clearState wipes the dev-launcher's remembered
# server too, so reconnect explicitly afterward (see e2e/helpers/launch-app.yaml)
- launchApp:
    clearState: true
- openLink: "exp+ocrecipes://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 5000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- assertVisible: "Sign In"
- tapOn: "Switch to sign up"
- assertVisible: "Create Account"

# Verify confirm password field appears
- assertVisible:
    id: "input-confirm-password"

# Toggle back to login
- tapOn: "Switch to sign in"
- assertVisible: "Sign In"
- assertNotVisible: "input-confirm-password"
