appId: com.ocrecipes.app
name: "Home - NutriCoach chat interaction"
tags:
  - regression
  - home
  - chat
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# The Home screen has no NutriCoach entry point — the chat lives behind the
# Coach tab. The CI account is always free tier, which lands on the chat
# list: header "NutriCoach" (a text-free spinner shows until the premium
# status resolves, hence the margin).
- tapOn:
    id: "tab-coach"
- extendedWaitUntil:
    visible: "NutriCoach"
    timeout: 15000

# The chat list's new-chat affordance is always present (a11y label
# "Start new chat" on the + button)
- assertVisible: "Start new chat"

# Start a new chat if the list shows the empty-state button
- tapOn:
    text: "New Chat"
    optional: true

# Verify suggested prompts are visible
- extendedWaitUntil:
    visible: "What should I eat today?"
    timeout: 3000
    optional: true
- assertVisible:
    text: "How can I hit my protein goal?"
    optional: true

# Tap a suggested prompt (AI responses are not asserted — CI stubs the
# OpenAI key)
- tapOn:
    text: "What should I eat today?"
    optional: true
