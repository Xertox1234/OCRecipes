appId: com.ocrecipes.app
name: "Home - NutriCoach chat interaction"
tags:
  - regression
  - home
  - chat
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# The Home screen has no NutriCoach entry point — the chat lives behind the
# Coach tab. The CI account is always free tier, which lands on the chat
# list: header "NutriCoach" (a text-free spinner shows until the premium
# status resolves, hence the margin).
- tapOn:
    id: "tab-coach"
- extendedWaitUntil:
    visible: "NutriCoach"
    timeout: 15000

# The chat list's new-chat affordance is always present (a11y label
# "Start new chat" on the + button) — unlike the empty-state "New Chat"
# button, which disappears once the account has any chat history, so it is
# the only deterministic way into a ChatScreen.
- assertVisible: "Start new chat"
- tapOn: "Start new chat"

# Verify suggested prompts in the fresh (empty) chat. The chips' a11y
# labels are "Suggested prompt: <text>" (ChatScreen.tsx), and the literal
# "?" is a regex metacharacter under Maestro's full-string matching — the
# ".*" tail covers it (a bare "…today?" selector can never match anything).
- extendedWaitUntil:
    visible: "Suggested prompt: What should I eat today.*"
    timeout: 10000
- assertVisible:
    text: "Suggested prompt: How can I hit my protein goal.*"

# Tap a suggested prompt (AI responses are not asserted — CI stubs the
# OpenAI key)
- tapOn:
    text: "Suggested prompt: What should I eat today.*"
    optional: true
