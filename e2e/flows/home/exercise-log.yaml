appId: com.ocrecipes.app
name: "Home - Log exercise activity"
tags:
  - home
  - exercise
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Navigate to exercise log from home screen (mandatory navigation)
- extendedWaitUntil:
    visible:
      text: "Exercise"
    timeout: 5000
- tapOn:
    text: "Exercise"

# Verify exercise type chips are visible (mandatory — proves screen loaded)
- extendedWaitUntil:
    visible:
      text: "Cardio"
    timeout: 5000
- assertVisible: "Strength"

# Select exercise type
- tapOn:
    text: "Cardio"
    optional: true

# Tap search to find an exercise
- tapOn:
    id: "search-exercise"
    optional: true

# If search screen opens
- extendedWaitUntil:
    visible:
      text: "Search exercises..."
    timeout: 3000
    optional: true

- tapOn:
    text: "Search exercises..."
    optional: true
- inputText:
    text: "running"
    optional: true

# Wait for results
- extendedWaitUntil:
    visible:
      text: "Running"
    timeout: 5000
    optional: true

# Go back
- back:
    optional: true
