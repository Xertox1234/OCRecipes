appId: com.ocrecipes.app
name: "Home - Navigate between tabs"
tags:
  - smoke
  - regression
  - navigation
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Verify Home tab (default after login). The greeting renders
# "Hello <name>" — Maestro text matching is full-string regex, so a bare
# "Hello" can never match it.
- extendedWaitUntil:
    visible: "Hello.*"
    timeout: 10000

# Scan is a floating action button, not a tab — and it only renders on root
# screens (it is absent on the Coach tab, where this check used to live).
# Assert it here on Home, where it is deterministic.
- extendedWaitUntil:
    visible: "Open scan menu"
    timeout: 10000

# Tab taps use the tabBarButtonTestID handles from MainTabNavigator.tsx —
# text taps are unreliable here (Android's system nav bar exposes its own
# "Home" a11y node, and the tab buttons' aggregated labels vary).

# Navigate to Plan tab. The action row's buttons expose a11y labels, not
# their visible text ("Browse Recipes", not "Recipes"), and tab switches can
# briefly re-flash the splash overlay — wait with margin.
- tapOn:
    id: "tab-plan"
- extendedWaitUntil:
    visible: "Browse Recipes"
    timeout: 15000

# Navigate to Coach tab. The CI account is always free tier, which lands on
# the chat list — its header is "NutriCoach" (a text-free spinner shows
# until the premium status resolves, hence the margin).
- tapOn:
    id: "tab-coach"
- extendedWaitUntil:
    visible: "NutriCoach"
    timeout: 15000

# Navigate to Profile tab
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Profile photo. Tap to change"
    timeout: 10000

# Navigate back to Home
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Hello.*"
    timeout: 5000
