appId: com.ocrecipes.app
# No "?" in the name: Maestro names the debug-output folder after it, and upload-artifact rejects
# the character (guard: scripts/ci/__tests__/e2e-flow-names.test.ts).
name: "Plan - Family planning switch, a profile, and who a meal is for"
tags:
  - regression
  - plan
  - family
env:
  # The premium account seeded by e2e-regression.yml (seed-e2e-user.sh with PREMIUM=1), the same
  # one receipt-upload.yaml uses: family profiles are a premium feature, and the shared USERNAME
  # account must stay free.
  PREMIUM_USERNAME: e2epremium
  PASSWORD: ${PASSWORD}
# Sign the premium account out however the flow ended, so later flows sign in as the free account.
onFlowComplete:
  - runFlow: ../../helpers/launch-app.yaml
  - runFlow: ../../helpers/ensure-logged-out.yaml
---
# Family profiles (spec 2026-11-16, stage 2): turn "Plan for my family" on, add one person, and
# check the Plan grid then offers who a new meal is for. The profile is saved with a name only
# (no allergy, no note), so the health-data consent sheet is never involved.
#
# Safe to retry: the profile and the switch stay on the account, and each step below is skipped
# when an earlier attempt already did it. Run on the iOS simulator from all three starting
# states: switch off, switch on with nobody saved, and the person already saved.
- runFlow: ../../helpers/launch-app.yaml
# An earlier flow may have left the shared account signed in.
- runFlow: ../../helpers/ensure-logged-out.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${PREMIUM_USERNAME}
      PASSWORD: ${PASSWORD}

- runFlow:
    file: ../../helpers/tap-tab.yaml
    env:
      TAB: "tab-profile"

# The switch sits in the settings card, below the library tiles. Scroll to the row's text, but
# tap the switch by its testID (InlineSettings.tsx): the row's text and the switch share one
# label, and a tap on the text does not toggle it (measured on the iOS simulator).
- scrollUntilVisible:
    element: "Plan for my family"
    direction: DOWN
    timeout: 20000

# Turn the switch on unless it already is: the "Family" row only exists while it is on.
- runFlow:
    when:
      notVisible: "Family"
    commands:
      - tapOn:
          id: "family-planning-switch"

# With nobody saved yet, turning it on opens the add form.
- extendedWaitUntil:
    visible: "Add a person"
    timeout: 10000
    optional: true

# No form: the switch was already on (a retry). An earlier attempt may have stopped between the
# switch and Save, so check the Family list and open the form from there when the person is missing.
- runFlow:
    when:
      notVisible: "Add a person"
    commands:
      # The row sits right below the switch, where the scroll above leaves it under the tab bar:
      # a tap there lands on a tab (measured on the iOS simulator: it opened Coach). Centre it first.
      - scrollUntilVisible:
          element: "Family"
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn: "Family"
      - extendedWaitUntil:
          visible: "(E2E Kid.*|Add a family member)"
          timeout: 15000
      - runFlow:
          when:
            notVisible: "E2E Kid.*"
          commands:
            - tapOn: "Add a family member"
            - extendedWaitUntil:
                visible: "Add a person"
                timeout: 10000

- runFlow:
    when:
      visible: "Add a person"
    commands:
      - tapOn: "Name"
      - inputText: "E2E Kid"
      # Drop the keyboard by tapping static text, NOT hideKeyboard: its iOS implementation is
      # flaky (complete-onboarding.yaml) and failed here on the CI simulator (run 43981529576).
      - tapOn:
          text: "Allergies"
          retryTapIfNoChange: false
      - scrollUntilVisible:
          element: "Save"
          direction: DOWN
          timeout: 15000
      - tapOn: "Save"
      # Back on the screen the form was opened from; both show "Family" (the row, or the title).
      - extendedWaitUntil:
          visible: "Family"
          timeout: 15000

# The Plan grid now shows the filter chips, with one for the new person.
- runFlow:
    file: ../../helpers/tap-tab.yaml
    env:
      TAB: "tab-plan"
- extendedWaitUntil:
    visible: '\d+ of 28 planned'
    timeout: 15000
- extendedWaitUntil:
    visible: "E2E Kid"
    timeout: 10000
- assertVisible: "All"
- assertVisible: "Me"

# The add menu asks who the meal is for. Opened from one of today's empty cells: the grid opens
# on today's column, so that cell is on screen, while a regex over every empty cell can land on
# an earlier day that sits off-screen to the left (measured). Not through today's day view: with
# no meals planned, as on the CI account, that view shows an empty state and no "Add … item".
# A cell's label starts with its weekday (week-grid-utils.ts getCellAccessibilityLabel).
- evalScript: ${output.weekday = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()]}
- tapOn:
    text: '${output.weekday} .*, empty, add a meal'
    index: 0
- extendedWaitUntil:
    visible: "Who's it for\\?"
    timeout: 10000
- assertVisible: "Everyone"
- assertVisible: "Just me"
