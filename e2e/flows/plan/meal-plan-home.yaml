appId: com.ocrecipes.app
name: "Plan - Meal plan home and pantry"
tags:
  - regression
  - plan
  - meal-plan
env:
  USERNAME: ${USERNAME}
  PASSWORD: ${PASSWORD}
---
# Login first
- runFlow: ../../helpers/launch-app.yaml
- runFlow:
    file: ../../helpers/login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}

# Navigate to Plan tab (tabBarButtonTestID handle from MainTabNavigator.tsx)
- tapOn:
    id: "tab-plan"

# Verify meal plan home elements. The action row's buttons expose a11y
# labels, not their visible text ("Browse Recipes", not "Recipes"), and tab
# switches can briefly re-flash the splash overlay — wait with margin.
- extendedWaitUntil:
    visible: "Browse Recipes"
    timeout: 15000
# The Pantry row's a11y label grows a suffix when items are near expiry
# ("Pantry, 2 expiring" — MealPlanHomeScreen), which a bare full-string
# "Pantry" can never match.
- assertVisible: 'Pantry(, \d+ expiring)?'
- assertVisible: "Grocery Lists"

# Verify meal slot sections (at least one should be visible)
- extendedWaitUntil:
    visible:
      text: "Breakfast"
    timeout: 3000
    optional: true
- assertVisible:
    text: "Lunch"
    optional: true
- assertVisible:
    text: "Dinner"
    optional: true
- assertVisible:
    text: "Snack"
    optional: true

# Check daily total section
- scrollUntilVisible:
    element: "Daily Total"
    direction: DOWN
    optional: true

# Navigate to Pantry (same expiring-suffix tolerance as the assert above)
- scrollUntilVisible:
    element: 'Pantry(, \d+ expiring)?'
    direction: UP
- tapOn: 'Pantry(, \d+ expiring)?'

# Verify pantry screen
- extendedWaitUntil:
    visible:
      text: "Your Pantry"
    timeout: 5000
    optional: true

# May see empty state
- extendedWaitUntil:
    visible:
      text: "Pantry is Empty"
    timeout: 3000
    optional: true

# Check add item input
- assertVisible:
    text: "Add pantry item..."
    optional: true

# (No trailing `back` — that command is Android-only and fails the flow on
# iOS; every flow relaunches via openLink anyway, so no cleanup is needed.)
