appId: com.ocrecipes.app
name: "Onboarding - Register and complete onboarding"
tags:
  - smoke
  - regression
  - onboarding
---
# Launch fresh app — clearState wipes the dev-launcher's remembered server
# too, so reconnect explicitly afterward (see e2e/helpers/launch-app.yaml,
# whose own header documents this exact two-step pattern)
- launchApp:
    clearState: true
- runFlow: ../../helpers/launch-app.yaml

# Switch to register mode. A bare assertVisible uses Maestro's short stock
# default timeout, not e2e/helpers/login.yaml's tuned margin -- this flow
# doesn't call that helper, so it needs the same explicit wait itself
# (see that file's header for why 90s).
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 90000
- tapOn: "Switch to sign up"
- assertVisible: "Create Account"

# Fill registration form
- tapOn:
    id: "input-username"
- inputText: "e2etest_${TIMESTAMP}"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- tapOn:
    id: "input-confirm-password"
- inputText: "TestPass123!"
- tapOn: "Create Account"

# Wait for Welcome screen
- extendedWaitUntil:
    visible:
      text: "Get Started"
    timeout: 10000

# Screen 1: Welcome
- tapOn: "Get Started"

# Screen 2: Diet Type
- assertVisible: "Go back"
- tapOn: "Omnivore"

# Screen 3: Allergies — skip without selecting
- extendedWaitUntil:
    visible:
      text: "Go back"
    timeout: 3000
- tapOn:
    text: "No Allergies"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# Screen 4: Health Conditions — skip without selecting
- extendedWaitUntil:
    visible:
      text: "Go back"
    timeout: 3000
- tapOn:
    text: "None of These"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# Screen 5: Goals — continue
- extendedWaitUntil:
    visible:
      text: "Go back"
    timeout: 3000
- tapOn: "Continue"

# Screen 6: Preferences
- extendedWaitUntil:
    visible:
      text: "Complete setup"
    timeout: 5000
- tapOn: "Complete setup"

# Should land on home screen after onboarding
- extendedWaitUntil:
    visible:
      text: "Hello"
    timeout: 10000
