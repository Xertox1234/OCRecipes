appId: com.ocrecipes.app
name: "Onboarding - Register and complete onboarding"
tags:
  - smoke
  - regression
  - onboarding
---
# Launch + overlay handling (see e2e/helpers/launch-app.yaml), then force a
# logged-out Sign In screen via UI logout — clearState is broken against the
# dev client on both platforms (see e2e/helpers/ensure-logged-out.yaml)
- runFlow: ../../helpers/launch-app.yaml
- runFlow: ../../helpers/ensure-logged-out.yaml

# Switch to register mode (the mode switch can briefly re-flash the splash
# overlay — wait for the settled form). retryTapIfNoChange disabled: the
# default auto-retap can toggle the mode straight back (see auth/login.yaml).
- tapOn:
    text: "Switch to sign up"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: "input-confirm-password"
    timeout: 15000

# Unique username per invocation — the old "${TIMESTAMP}" env var was never
# defined anywhere (workflow env or -e flags), and a fixed name collides with
# the account the previous attempt registered. String() keeps the number out
# of exponent notation.
- evalScript: ${output.ts = String(Date.now())}

# COPPA attestation FIRST, while no keyboard is up — with the keyboard open
# the checkbox sits under it and a coordinate tap lands on the keyboard
# instead (observed locally: tap "completed", box stayed unchecked).
# retryTapIfNoChange disabled: an auto-retap on a checkbox unchecks it.
- tapOn:
    id: "checkbox-age-confirm"
    retryTapIfNoChange: false

# Fill registration form — all four fields; the Email field and the age
# checkbox were missing from the original flow, and the submit button stays
# disabled until every one of them is satisfied.
#
# Password + confirm-password entry (show-password -> type -> blur -> confirm
# -> blur). This is the FIRST-ATTEMPT variant: every action step is
# MANDATORY, because on this path these steps are the only thing that puts
# credentials in the form. The retry loop below calls the permissive
# `-retry` sibling instead — same actions, opposite failure semantics.
# See e2e/helpers/enter-registration-passwords.yaml for the full rationale
# (iOS-26-sim secure-field swallow, the stable blur-by-id target, its three
# mandatory existence anchors, and the "WHY TWO FILES" regression note
# explaining why these two call sites must not share one file).
- runFlow: ../../helpers/enter-registration-passwords.yaml
- tapOn:
    id: "input-username"
# Gboard's "Try out your stylus" promo sheet (Google-APIs emulator images)
# appears on the secure→plain keyboard switch, STEALS focus into its own
# "Write here" field, and swallows lower-screen taps. Dismiss and refocus.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
      - tapOn:
          id: "input-username"
- inputText: "e2etest_${output.ts}"
- tapOn:
    id: "input-email"
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
      - tapOn:
          id: "input-email"
- inputText: "e2etest_${output.ts}@example.com"

# Drop the keyboard so the submit button's coordinates are actually
# tappable. NOT via hideKeyboard — its iOS implementation is flaky and was
# observed backgrounding the app entirely (home-gesture-like); a tap on the
# static header subtitle (by id, not its marketing copy — see
# e2e/helpers/enter-registration-passwords.yaml) blurs the input instead,
# which dismisses the keyboard.
- tapOn:
    id: "auth-form-subtitle"
    retryTapIfNoChange: false

- tapOn: "Create Account"

# Registration submits a password — iOS can raise the system "Save Password?"
# dialog here, which hides the entire app hierarchy until dismissed.
#
# SELF-HEALING RETRY: on the FIRST-ever focus of the secure fields, iOS's
# invisible "Use Strong Password?" sheet can swallow keystrokes AND pasted
# text (observed on CI: one character left in each field, submit rejected).
# A second entry into the same fields reliably lands (the sheet only appears
# once per field-focus session), so instead of fighting the sheet's timing,
# use the app's own outcome as the oracle: wait briefly for the Welcome
# screen, and while it hasn't appeared, re-enter both passwords and resubmit
# (bounded at 3 rounds). Every command inside the loop is optional — the
# erase/type steps included, so a silently-failed optional focus tap (the
# keyboard-covered-field mode above) degrades to a skipped round instead of
# hard-failing the recovery loop on an unfocused field.
- extendedWaitUntil:
    visible: "(Get Started|Not Now)"
    timeout: 20000
    optional: true
- repeat:
    times: 3
    while:
      notVisible: "(Get Started|Not Now)"
    commands:
      # Same password + confirm-password sequence as the main block above,
      # but the RETRY variant: every step optional and erase-before-type, so
      # a silently-failed focus tap (the keyboard-covered-field mode)
      # degrades to a skipped step instead of hard-failing the recovery loop,
      # and the already-flipped "Show password" toggle does not hard-fail
      # round 2+.
      #
      # This MUST NOT be the same file the main block calls. The two call
      # sites need the same actions under OPPOSITE failure semantics, and a
      # single union file using this permissive shape for both let the first
      # attempt submit empty passwords silently — see the "WHY TWO FILES"
      # note in e2e/helpers/enter-registration-passwords.yaml.
      - runFlow: ../../helpers/enter-registration-passwords-retry.yaml
      - tapOn:
          text: "Create Account"
          optional: true
      - extendedWaitUntil:
          visible: "(Get Started|Not Now)"
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: "(Get Started|Not Now)"
    timeout: 15000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Onboarding wizard — real screen order from OnboardingNavigator.tsx:
# Welcome → HealthDataConsent → Allergies → HealthConditions → DietType →
# Goals → Preferences → TastePicks. (The previous version of this flow
# tapped a "Complete setup" button that does not exist anywhere in the
# codebase; completion actually happens on TastePicks.)

# 1. Welcome
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 15000
- tapOn: "Get Started"

# 2. Health data consent — decline sharing ("Not now, skip health data
#    sharing" a11y label)
- extendedWaitUntil:
    visible: "Not now.*"
    timeout: 15000
- tapOn: "Not now.*"

# 3. Allergies — none, then advance (Continue kept optional in case the
#    selection auto-advances)
- extendedWaitUntil:
    visible: "No Allergies"
    timeout: 15000
- tapOn: "No Allergies"
- tapOn:
    text: "Continue"
    optional: true

# 4. Health conditions — none, then advance
- extendedWaitUntil:
    visible: "None of These"
    timeout: 15000
- tapOn: "None of These"
- tapOn:
    text: "Continue"
    optional: true

# 5. Diet type — cards carry a11y "{name}: {description}"
- extendedWaitUntil:
    visible: "Omnivore.*"
    timeout: 15000
- tapOn: "Omnivore.*"
- tapOn: "Continue"

# 6. Goals — defaults are fine
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
- tapOn: "Continue"

# 7. Preferences — forward button is visible "Next" with a11y "Next step"
- extendedWaitUntil:
    visible: "Next step"
    timeout: 15000
- tapOn: "Next step"

# 8. Taste picks — "Skip for now" is a real completion path: it sets
#    onboardingCompleted:true (TastePicksScreen skip handler)
- extendedWaitUntil:
    visible: "Skip for now"
    timeout: 15000
- tapOn: "Skip for now"

# Landed on Home as the new user (greeting renders "Hello <username>")
- extendedWaitUntil:
    visible: "Hello.*"
    timeout: 30000

# Leave the suite logged out: without this, the fresh e2etest_* session leaks
# into every later flow in path order (plan/, scan/) and they run as the
# wrong user. Ending logged out makes each flow's user deterministic — the
# login helper logs the rest in as the seeded testuser.
- runFlow: ../../helpers/ensure-logged-out.yaml
