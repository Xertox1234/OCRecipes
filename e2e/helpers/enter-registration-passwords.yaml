appId: com.ocrecipes.app

# Password + confirm-password entry for the registration form — the
# FIRST-ATTEMPT variant, in which every action step is MANDATORY.
#
# Pair file: enter-registration-passwords-retry.yaml, which is the same
# sequence with every action step `optional: true` plus erase-before-type.
# Use that one from a self-healing retry loop; use THIS one from a
# first-attempt path.
#
# WHY TWO FILES (regression, 2026-09-03 — read before merging them again):
# an earlier revision of this helper was a single UNION file that adopted the
# retry loop's `optional: true` shape everywhere, on the reasoning that an
# optional step is a superset of a mandatory one and therefore safe for both
# callers. Its header stated outright: "no separate 'first attempt' vs 'retry'
# variant needed." That is wrong, and it silently broke the iOS suite.
#
# `optional:` is not a property of the STEP, it is a property of the CALL
# SITE. On the first attempt these taps and inputs are the only thing that
# puts credentials in the form: if the "Show password" tap misses, every
# following step WARN-skips, the form submits with EMPTY passwords, and the
# flow still goes green — the damage surfaces two flows later as an
# unrelated-looking "X is visible" assertion in a flow nobody touched. Inside
# the retry loop the opposite is required: the fields may already be
# populated and the toggle already flipped, so a mandatory step there would
# hard-fail the recovery it exists to perform.
#
# Measured, not argued: iOS was green 3/3 on the pre-union commits
# (33baffea, 24028f1c twice) and red 2/2 on the union commit (5b3b88ef),
# under matched warm-cache conditions.
#
# Callers own username/email entry and the final "Create Account" submit —
# this helper only covers the two password fields, since the main block types
# username/email BETWEEN this helper's second blur and its own submit, while
# the retry loop submits immediately after (see complete-onboarding.yaml).
#
# SHOW PASSWORDS FIRST, THEN TYPE PLAIN: synthetic input into iOS-26-sim
# secureTextEntry fields delivers exactly one character whether typed or
# pasted (run-33326267830 hierarchy: fields still at "•" after THREE
# erase+paste rounds, while the plain username/email fields typed perfectly).
# The form's own Show-password toggle flips BOTH password fields to plain
# text (one shared showPassword state in LoginScreen), where synthetic typing
# works — and a non-secure field never attracts the AutoFill sheets either. A
# visible test credential on a CI screenshot is harmless.
#
# The "Show password" tap is MANDATORY here and optional in the retry variant,
# for the reason in that file: `showPassword` is a single toggle with no reset
# (client/screens/LoginScreen.tsx), so after the first successful tap the
# control permanently reads "Hide password" for the rest of the session. On a
# first attempt against a freshly-launched app it always reads "Show password".
#
# Blur target: tap by id "auth-form-subtitle" (LoginScreen.tsx's header
# subtitle testID), NOT its marketing copy. Maestro text selectors are
# full-string regexes matched against the aggregated accessibility tree, so a
# text-anchored blur silently breaks the moment that copy is reworded — see
# docs/solutions/logic-errors/maestro-text-matching-is-full-string-regex-2026-08-30.md.
# Dropping the keyboard before the confirm tap is load-bearing: with the
# keyboard up it covers that field on CI's screen layout, the tap never moves
# focus, and the confirm text lands in the password field instead
# (run-33329846839 hierarchy: password full, confirm empty).
#
# The three `assertVisible` anchors are mandatory so a renamed/removed testID
# fails FAST here rather than degrading into an unrelated-looking
# `extendedWaitUntil` timeout downstream — see
# docs/solutions/logic-errors/optional-e2e-steps-cannot-fail-dead-selectors-stay-green-2026-08-30.md.
# The blur-target anchor matters as much as the field anchors: both blur taps
# below target it, and without an anchor a stale blur testID would leave the
# keyboard up and reproduce the run-33329846839 corruption above.
---
- assertVisible:
    id: "input-password"
- assertVisible:
    id: "auth-form-subtitle"

- tapOn:
    text: "Show password"
    retryTapIfNoChange: false
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"

- tapOn:
    id: "auth-form-subtitle"
    retryTapIfNoChange: false

- assertVisible:
    id: "input-confirm-password"
- tapOn:
    id: "input-confirm-password"
- inputText: "TestPass123!"

- tapOn:
    id: "auth-form-subtitle"
    retryTapIfNoChange: false
