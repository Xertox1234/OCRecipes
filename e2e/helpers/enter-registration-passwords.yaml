appId: com.ocrecipes.app

# Shared password + confirm-password entry for the registration form —
# a UNION of two previously-duplicated sequences from
# complete-onboarding.yaml: the main block's stricter, first-attempt version
# (fields start empty, every step mandatory) and its own self-healing retry
# loop's more permissive version (fields may hold a stale value, every step
# `optional: true`, plus extra `eraseText` steps and a Gboard stylus-sheet
# guard the main block lacked). This helper adopts the retry loop's
# optional/erase-first shape everywhere (see "Idempotent by design" below)
# and restores the main block's fail-fast guarantee via the two mandatory
# `assertVisible` anchors below, rather than being a byte-for-byte copy of
# either original sequence. See
# todos/archive/P3-2026-08-30-e2e-suite-dedup-and-maintainability-followups.md.
#
# Callers own username/email entry and the final "Create Account" submit —
# this helper only covers the two password fields, since the main block
# types username/email BETWEEN this helper's second blur and its own submit,
# while the retry loop submits immediately after (see complete-onboarding.yaml).
#
# Idempotent by design: every step below `assertVisible` is `optional: true`
# and each field is erased before typing. That makes the SAME helper safe to
# call both on the fresh form (fields already empty — the erase is a no-op)
# and from inside a retry round (a field may still hold a partial/stale
# value from an interrupted previous attempt) — no separate "first attempt"
# vs "retry" variant needed.
#
# Mandatory anchors: `input-password` and `input-confirm-password` existence
# is asserted (not optional) — these fields are expected to be on screen
# every time this helper runs (main block AND every retry round). The retry
# loop's own gate is `while: notVisible: "(Get Started|Not Now)"`
# (complete-onboarding.yaml), not "still on the register form" specifically —
# e.g. a `VerifyEmail` redirect on `verification_pending` would also satisfy
# it and re-enter this helper on a screen with no password fields. That path
# is inert in this suite today (email verification is gated on
# `RESEND_API_KEY`, which e2e-regression.yml's env doesn't set) and, if it
# ever did trigger, fails loud here rather than silently, so this helper
# doesn't need to defend against it itself. If either selector goes stale
# (renamed/removed testID) in the expected case, this fails FAST here
# instead of degrading silently through the optional steps below into an
# unrelated-looking `extendedWaitUntil` timeout downstream — see
# docs/solutions/logic-errors/optional-e2e-steps-cannot-fail-dead-selectors-stay-green-2026-08-30.md.
#
# The "Show password" tap is deliberately NOT given the same mandatory
# treatment: `showPassword` is a single toggle with no reset
# (client/screens/LoginScreen.tsx), so after this helper's first successful
# tap the control permanently reads "Hide password" for the rest of the
# session. A mandatory assert/tap on "Show password" would hard-fail every
# retry round after the first. `optional: true` here is intentional, not an
# oversight.
#
# Blur target: tap by id "auth-form-subtitle" (LoginScreen.tsx's header
# subtitle testID), NOT its marketing copy text. Maestro text selectors are
# full-string regexes matched against the aggregated accessibility tree, so a
# text-anchored blur silently breaks the moment that copy is reworded — see
# docs/solutions/logic-errors/maestro-text-matching-is-full-string-regex-2026-08-30.md.
#
# SHOW PASSWORD FIRST, THEN TYPE PLAIN: synthetic input into iOS-26-sim
# secureTextEntry fields is swallowed — go through the form's own
# Show-password toggle first, same as every other credential-entry flow in
# this suite. See docs/solutions/logic-errors/ios-sim-secure-fields-swallow-synthetic-input-2026-08-30.md.
---
- assertVisible:
    id: "input-password"
# Third mandatory anchor, added 2026-09-03 during merge review. The two blur
# taps below both target "auth-form-subtitle" and are both `optional: true`
# (correctly — a blur is a no-op when the keyboard is already down), which
# means a stale blur target would WARN-skip on BOTH and degrade exactly the way
# optional-e2e-steps-cannot-fail-dead-selectors-stay-green-2026-08-30.md
# describes: the keyboard stays up, it covers the confirm field, and the
# confirm text lands in the password field — the run-33329846839 corruption
# this helper's own comments cite, resurfacing as an unrelated-looking
# downstream timeout.
#
# The field anchors above/below cover FIELD existence, not BLUR-TARGET
# existence, so they do not catch this. This selector is also newly introduced
# by the extraction (the pre-extraction flow blurred by marketing-copy text)
# and has therefore never executed in CI, so it gets an anchor before its first
# run rather than after its first silent failure. Verified 2026-09-03 that
# testID "auth-form-subtitle" is on the ThemedText node itself in
# LoginScreen.tsx's SHARED header — only its child copy is mode-conditional —
# so this assert holds in both login and register modes.
- assertVisible:
    id: "auth-form-subtitle"

# See "The 'Show password' tap is deliberately NOT..." above — optional by
# design, not a lost anchor.
- tapOn:
    text: "Show password"
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: "input-password"
    optional: true
# Gboard's "Try out your stylus" promo sheet (Google-APIs emulator images)
# can appear on a keyboard-focus switch, STEAL focus into its own "Write
# here" field, and swallow lower-screen taps. Dismiss + refocus.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
      - tapOn:
          id: "input-password"
          optional: true
- eraseText:
    charactersToErase: 50
    optional: true
- inputText:
    text: "TestPass123!"
    optional: true
# Drop the keyboard before focusing the confirm field: with the keyboard up
# it covers that field on CI's screen layout, the tap never moves focus, and
# the confirm text lands in the password field instead.
- tapOn:
    id: "auth-form-subtitle"
    optional: true
    retryTapIfNoChange: false
- assertVisible:
    id: "input-confirm-password"
- tapOn:
    id: "input-confirm-password"
    optional: true
- eraseText:
    charactersToErase: 50
    optional: true
- inputText:
    text: "TestPass123!"
    optional: true
- tapOn:
    id: "auth-form-subtitle"
    optional: true
    retryTapIfNoChange: false
