appId: com.ocrecipes.app

# Reusable login helper — call with `runFlow` and provide env vars:
#   USERNAME (default: testuser)
#   PASSWORD (default: testpass123)
---
# NOTE (2026-08-16): a cold-Metro-bundle theory for the "Sign In" wait was
# tested and DISPROVEN on live CI — metro.log showed the bundle completing
# in ~54-58s, but flows still failed after the full 90s extendedWaitUntil
# below was exhausted. The real cause of "Sign In never becomes visible" is
# still open (see todos/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md
# Updates) — leading suspect is that Maestro's bare `launchApp` (appId only,
# no dev-client server URL) never reaches the running Metro server at all and
# instead lands on the Expo dev-launcher's own picker screen. Do not extend
# this timeout further as a fix — it will not help until that is resolved.
# Left at a modest margin over Maestro's own default rather than reverted to
# it, since a real cold-start screen (not a dev-launcher picker) may still
# need more than the ~17-20s default.
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000
- tapOn:
    id: "input-username"
- inputText: ${USERNAME}
- tapOn:
    id: "input-password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible:
      text: "Sign In"
    timeout: 5000
