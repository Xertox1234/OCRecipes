appId: com.ocrecipes.app

# Reusable login helper — call with `runFlow` and provide env vars:
#   USERNAME (default: testuser)
#   PASSWORD (default: testpass123)
#
# State-aware since 2026-08-30 (evidence: dispatch-9 artifacts — see
# todos/archive/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md):
#
# - Flows don't clear app state between each other, so the app may already be
#   authenticated from an earlier flow in the same job. The entry gate waits
#   for EITHER known state (Maestro text matching is full-string regex; the
#   Home greeting renders "Hello <name>", never bare "Hello"). The old shape —
#   an optional 90s wait for "Sign In" alone — burned its entire timeout
#   staring at the Home screen in every already-authenticated flow.
#   e2e/helpers/launch-app.yaml's 240s readiness gate now owns the cold-start
#   budget, so the entry wait here (60s — see the inline note at the wait)
#   is margin, not the first line of defense.
#
# - Credential entry runs only `when: visible: "Sign In"`. The CI workflow's
#   "Seed E2E test user" step marks the account `onboardingCompleted: true`
#   specifically so an inherited session lands on the Main app (a known,
#   testable state) rather than the onboarding wizard.
#
# - After submit, iOS can raise the system "Save Password?" dialog. While a
#   system alert is up the app hierarchy is entirely absent from Maestro's
#   view, so the dialog must be dismissed ("Not Now") before asserting Home.
#   The wait targets "(Hello.*|Not Now)" — whichever appears first — and the
#   gated tap only fires when the dialog is actually there.
#
# - The final wait is this helper's contract: it exits on the Home screen,
#   whichever path ran.
#
# - Wizard-strand recovery (added after main-dispatch 33341123446): if a
#   PREVIOUS flow's registration died mid-onboarding (there: an XCUITest
#   driver transport crash right after Create Account), the app relaunches
#   into the wizard — a state with neither "Sign In" nor "Hello". Only
#   auth/login and complete-onboarding used to route through
#   ensure-logged-out's escape, so the strand turned every OTHER flow in the
#   attempt red until one of those two ran. The gated runFlow below makes
#   every login-helper flow self-healing: it fires only when a wizard marker
#   is on screen, escapes + logs out via ensure-logged-out, and the normal
#   credential block then signs in as the intended user.
#   PRECONDITION: call this helper only as the FIRST step after
#   launch-app.yaml (every current caller does). The wizard markers are
#   unambiguous only immediately post-launch — "Go back" is also the header
#   back-button a11y label on several non-wizard capture/review screens
#   (CookSessionCapture, ReceiptCapture/Review, NotebookEntry, BatchScan),
#   so a mid-flow call from one of those would trigger a destructive
#   escape + logout.
---
- runFlow:
    when:
      visible: "(Get Started|Go back)"
    file: ensure-logged-out.yaml
# The PREVIOUS flow's login can leave iOS's "Save Password?" dialog up into
# this launch (run 33397038006: navigate-tabs died here staring at exactly
# that dialog — while it is up the app hierarchy is absent, so neither
# "Sign In" nor "Hello" can match). Accept it as a known state and dismiss.
- extendedWaitUntil:
    visible: "(Sign In|Hello.*|Not Now)"
    # 60s, not 30s: launch-app's readiness gate can pass on a transient
    # overlay (dev-menu "Continue") while the app is still on its splash
    # screen — the splash stays up until the session check against the API
    # resolves, so a slow backend/runner extends it. Cheap margin: the happy
    # path returns as soon as a state matches.
    timeout: 60000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "(Sign In|Hello.*)"
    timeout: 30000
- runFlow:
    when:
      visible: "Sign In"
    commands:
      - tapOn:
          id: "input-username"
      # Gboard's "Try out your stylus" promo sheet (Google-APIs emulator
      # images) can appear on a keyboard switch, STEAL focus into its own
      # "Write here" field, and swallow lower-screen taps. Dismiss + refocus.
      - runFlow:
          when:
            visible: "Try out your stylus"
          commands:
            - tapOn: "Cancel"
            - tapOn:
                id: "input-username"
      - inputText: ${USERNAME}
      - tapOn:
          id: "input-password"
      - inputText: ${PASSWORD}
      - tapOn: "Sign In"
      # Outcome-oracle retry (same pattern as the register flow): run
      # 33397038006 submitted an EMPTY form — both fields blank, the app's
      # own "Please fill in all fields" validation showing — because the
      # typing never landed (fields tapped mid-transition). Instead of
      # fighting the timing, use the validation message as the oracle and
      # retype + resubmit, bounded. No-op when the first submit worked.
      # Settle first with the happy-path polarity: this returns the moment
      # Sign In disappears (a working submit), and only spends its 5s when
      # the form is still up — by which time the validation text is rendered
      # for the loop's `while` to observe on its first evaluation.
      - extendedWaitUntil:
          notVisible:
            text: "Sign In"
          timeout: 5000
          optional: true
      - repeat:
          times: 2
          while:
            visible: "Please fill in all fields"
          commands:
            - tapOn:
                id: "input-username"
                optional: true
            - eraseText:
                charactersToErase: 50
                optional: true
            - inputText:
                text: ${USERNAME}
                optional: true
            - tapOn:
                id: "input-password"
                optional: true
            - eraseText:
                charactersToErase: 50
                optional: true
            - inputText:
                text: ${PASSWORD}
                optional: true
            - tapOn:
                text: "Sign In"
                optional: true
      - extendedWaitUntil:
          notVisible:
            text: "Sign In"
          timeout: 30000
      - extendedWaitUntil:
          visible: "(Hello.*|Not Now)"
          timeout: 30000
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Hello.*"
    timeout: 15000
