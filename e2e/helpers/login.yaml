appId: com.ocrecipes.app

# Reusable login helper — call with `runFlow` and provide env vars:
#   USERNAME (default: testuser)
#   PASSWORD (default: testpass123)
---
# NOTE (2026-08-16): two DIFFERENT failure modes were confirmed via
# Maestro's own screenshot artifact on live CI (run 31938889879) — see
# todos/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md Updates.
# (1) The FIRST flow in a run can still be showing "Bundling 96.0%..." when
#     the wait times out — a real cold-start race against Metro. (2) Every
#     flow after that hits the Expo dev-client's own "developer menu"
#     welcome overlay popping up on top of an already-rendered Sign In
#     screen — see e2e/helpers/launch-app.yaml, which dismisses it before
#     this wait runs.
#
# NOTE (2026-08-29): with (2) confirmed fixed and NOT blocking (screenshot
# evidence: the Sign In screen renders cleanly, no overlay), a run under
# CI resource contention still showed every flow — not just the first —
# taking 23-59s to reach "Sign In", because each flow pays a full app
# relaunch + dev-client deep-link reconnect, not just a Metro re-bundle
# (Metro itself only bundles once per job — ~50s cold, ~300ms cached for
# every flow after). The 45000 the 2026-08-16 fix landed at wasn't margin
# enough against that combined cost under load. Bumped to give real
# headroom above the worst time actually observed (59s) rather than
# guessing a smaller number and re-discovering the same gap next run.
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 90000
- tapOn:
    id: "input-username"
- inputText: ${USERNAME}
- tapOn:
    id: "input-password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"
- extendedWaitUntil:
    notVisible:
      text: "Sign In"
    timeout: 5000
