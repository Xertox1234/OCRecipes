appId: com.ocrecipes.app

# Password + confirm-password entry for the registration form — the RETRY
# variant, in which every action step is `optional: true` and each field is
# erased before typing.
#
# Pair file: enter-registration-passwords.yaml, the first-attempt variant,
# where the same steps are MANDATORY. Read that file's "WHY TWO FILES" note
# before considering merging these back together. A single union file using
# this permissive shape for BOTH callers lets the FIRST attempt submit empty
# passwords and still report green, because an `optional:` step cannot fail.
# That is a semantic defect, established by what `optional:` means rather
# than by a CI comparison — see the pair file for why the run-level numbers
# once cited here did not support the claim they were attached to.
#
# Why this one must be permissive, where its pair must not:
#
# - `showPassword` is a single toggle with no reset
#   (client/screens/LoginScreen.tsx), so once the first attempt has flipped
#   it the control reads "Hide password" for the rest of the session. A
#   mandatory tap on "Show password" would hard-fail every retry round after
#   the first.
# - The fields may hold a partial or stale value from the interrupted
#   attempt, hence `eraseText` before each `inputText`. On a genuinely empty
#   field the erase is a harmless no-op.
# - A silently-failed focus tap (the keyboard-covered-field mode) must
#   degrade to a skipped step rather than hard-fail the recovery loop this
#   helper exists to perform.
#
# Deliberately NO mandatory `assertVisible` anchors here, unlike the pair
# file. The caller's loop gate is `while: notVisible: "(Get Started|Not Now)"`
# (complete-onboarding.yaml), not "still on the register form" — e.g. a
# VerifyEmail redirect would also satisfy it and re-enter this helper on a
# screen with no password fields, where a mandatory assert would convert a
# recoverable round into a hard failure. Selector staleness is caught by the
# pair file's anchors, which run first on every execution of this flow.
#
# Callers own the "Create Account" submit and the post-submit wait.
---
- tapOn:
    text: "Show password"
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: "input-password"
    optional: true
# Gboard's "Try out your stylus" promo sheet (Google-APIs emulator images)
# can appear when a retry round re-raises the keyboard, STEAL focus into its
# own "Write here" field, and swallow lower-screen taps. Dismiss + refocus.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
      - tapOn:
          id: "input-password"
          optional: true
- eraseText:
    charactersToErase: 50
    optional: true
- inputText:
    text: "TestPass123!"
    optional: true

- tapOn:
    id: "auth-form-subtitle"
    optional: true
    retryTapIfNoChange: false

- tapOn:
    id: "input-confirm-password"
    optional: true
- eraseText:
    charactersToErase: 50
    optional: true
- inputText:
    text: "TestPass123!"
    optional: true

- tapOn:
    id: "auth-form-subtitle"
    optional: true
    retryTapIfNoChange: false
