appId: com.ocrecipes.app

# Reusable "launch and connect to Metro" helper — every flow's first step.
#
# Design (2026-08-30, evidence: dispatch-9 artifacts, run 33292071278 — see
# todos/archive/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md):
#
# 1. The readiness gate below waits for ANY known post-launch state instead of
#    racing a fixed-timeout check against Metro's cold bundle (41-58s typical
#    on CI, but 177.7s observed under runner contention in main-dispatch
#    33341123446 — hence the 240s budget; the gate is non-optional, so a
#    genuinely broken launch still fails loud, just later). Maestro text
#    matching is FULL-STRING regex, so the alternation lists complete node
#    texts:
#      Continue        — dev-client "This is the developer menu" welcome banner
#      Sign In         — logged-out app
#      Hello.*         — logged-in app (Home greeting is "Hello <name>")
#      Not Now         — iOS "Save Password?" system dialog lingering from a
#                        previous flow's login/registration submit; while it is
#                        up the app hierarchy is entirely absent, so it MUST be
#                        part of this gate or the gate itself times out
#      Connected to:   — dev menu sheet left open (see 3)
#    The gate is NOT optional: if none of these appears in 240s the app is
#    genuinely broken and the flow should fail loudly right here.
#
# 2. The welcome banner sits ON TOP of the auto-opened dev menu on the first
#    cold connect after install. Tapping "Continue" dismisses only the banner
#    — the dev menu sheet ("Connected to: http://localhost:8081", Reload,
#    Go home, …) stays covering the app. That two-layer state, confirmed in
#    the run-33292071278 hierarchy dumps, is why earlier single-overlay fixes
#    kept half-working. The gated block closes the menu; its inner tap is
#    itself optional in case the dismiss control differs per platform.
#
# 3. No flow uses `launchApp` (with or without clearState) any more — every
#    launch goes through the openLink below, which needs no appId. That
#    matters because the app's identifiers are SPLIT per platform (iOS
#    bundleIdentifier `com.williamtower.ocrecipes`, Android applicationId
#    `com.ocrecipes.app` — see app.json), while flows can declare only one
#    `appId:`. The declared Android id made iOS `launchApp {clearState}`
#    error outright ("Failed to get app binary directory for bundle
#    com.ocrecipes.app" — no such bundle on the sim); and on Android, where
#    the id IS right, `pm clear` wipes the dev client's OWN storage and
#    strands the relaunch on the dev-client launcher screen. Logged-out
#    state comes from e2e/helpers/ensure-logged-out.yaml instead; the
#    `appId:` headers are load-bearing only for Maestro's schema, not for
#    any launch.
#
# `localhost:8081` resolves correctly on both CI jobs: the Android job's
# `adb reverse tcp:8081 tcp:8081` step tunnels the emulator's localhost to
# the runner's Metro; the iOS simulator shares the host Mac's loopback
# natively, no tunnel needed.
---
- openLink: "exp+ocrecipes://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"

# Readiness gate — see header (1). Also matches two stranded states a
# previous attempt's kill can leave behind: the Sign-Out confirmation sheet
# (killed mid-logout; an in-app sheet since issue #908 — the native alert it
# replaced could render on screen while absent from the accessibility
# hierarchy on CI, see ensure-logged-out.yaml) and the onboarding wizard
# ("Get Started"/"Go back" — killed mid-registration; ensure-logged-out's
# wizard-escape recovers from it, and every flow reaches that escape via the
# login helper's own wizard-strand gate — auth/login is NOT reliably first
# in path order (measured 4th; todos/P3-2026-09-03-launch-app-comment-claims-auth-login-runs-first.md)).
- extendedWaitUntil:
    visible: "(Continue|Sign In|Hello.*|Not Now|Connected to:|Are you sure you want to sign out.*|Get Started|Go back)"
    timeout: 240000

# Finish an interrupted logout: the in-app confirmation sheet (issue #908 —
# see ensure-logged-out.yaml for why this is no longer a native alert) may
# still be up from a previous attempt killed mid-logout; its confirm button's
# "Yes, Sign Out" label is a unique full-string match.
- runFlow:
    when:
      visible: "Are you sure you want to sign out.*"
    commands:
      - tapOn:
          text: "Yes, Sign Out"
          optional: true

# Lingering iOS Save-Password dialog from a previous flow — dismiss first so
# the real app hierarchy becomes visible for the checks below
- tapOn:
    text: "Not Now"
    optional: true

# Dev-client welcome banner (first cold connect only)
- tapOn:
    text: "Continue"
    optional: true

# Dev menu sheet — either left open under the banner just dismissed, or open
# from an earlier flow. Give it a beat to settle after the banner tap, then
# close it. The inner tap stays optional: the `when:` gate only guards entry,
# it does not soften a failing command inside.
- extendedWaitUntil:
    visible: "Connected to:"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          text: "Close"
          optional: true
