appId: com.ocrecipes.app

# Reusable "launch and connect to Metro" helper — call with `runFlow` in place
# of a bare `launchApp` (see e2e/flows/**). If the app is being cleared first
# via `launchApp: { clearState: true }`, call that separately and follow it
# with this file rather than using it directly (see auth/login.yaml and
# onboarding/complete-onboarding.yaml for that two-step pattern).
#
# ROOT CAUSE, confirmed via Maestro's own screenshot artifact on live CI
# (2026-08-16, run 31938889879 — see
# todos/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md Updates):
# the app DOES connect to Metro and DOES render the real "Sign In" screen
# underneath — the failure is that the Expo dev-client's own "developer
# menu" welcome overlay ("This is the developer menu... Continue") pops up
# on top of it on every fresh launch, dimming/blocking the login screen so
# Maestro's assertVisible never sees it as interactable. Two earlier
# theories (a cold Metro bundle needing a longer wait; a bare `launchApp`
# never reaching Metro at all) were each tested on live CI and disproven —
# this screenshot is the first evidence that actually shows what was on
# screen, rather than inferring it from timing.
#
# `optional: true` below means this step does NOT fail the flow if the
# overlay doesn't appear (e.g. once Expo stops showing it after a device
# has "seen" it before). CONFIRMED FIXED on CI (2026-08-29, run
# 33276571201): screenshot evidence shows this "Continue" dismiss
# correctly no-ops when the overlay isn't there.
#
# SECOND, DIFFERENT overlay found the same day (2026-08-29, same run):
# the Expo dev MENU (not the welcome banner above) — "Connected to:
# http://localhost:8081", Reload/Go home, a Tools list — renders as a
# bottom-sheet-style modal on top of the already-loaded Sign In screen
# (its blurred background photo is visible behind the sheet in the
# screenshot, confirming the real screen is rendered underneath, not
# still loading). Unlike the welcome banner it has no dismiss button
# with a stable text/id Maestro can target reliably, so this uses
# Android's own back gesture — the standard way to close a bottom-sheet
# modal — gated behind detecting "Go home" so it never fires (and can't
# navigate the app itself backward) when the menu isn't showing.
# **NOT YET VERIFIED on CI** — the syntax was checked locally
# (`maestro test` against the local emulator: parsed and ran with no
# schema errors) but the fix itself needs a live dispatch to confirm it
# actually closes the modal. Verify before trusting this as done.
#
# `localhost:8081` resolves correctly on both CI jobs: the Android job's
# `adb reverse tcp:8081 tcp:8081` step tunnels the emulator's localhost to
# the runner's Metro; the iOS simulator shares the host Mac's loopback
# natively, no tunnel needed.
---
- openLink: "exp+ocrecipes://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 5000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Go home"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
