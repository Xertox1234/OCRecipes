appId: com.ocrecipes.app

# Reusable "launch and connect to Metro" helper — call with `runFlow` in place
# of a bare `launchApp` (see e2e/flows/**). If the app is being cleared first
# via `launchApp: { clearState: true }`, call that separately and follow it
# with this file rather than using it directly (see auth/login.yaml and
# onboarding/complete-onboarding.yaml for that two-step pattern).
#
# REVERTED 2026-08-29 (run 33283020295): this session tried two overlay-
# dismiss theories in turn — bumping this wait to 90000ms, then adding a
# second wait+back-press for the Expo dev menu's "Go home" sheet — chasing
# screenshots that seemed to show each overlay blocking "Sign In". Both
# were wrong. `maestro.log` timing on the run that finally nailed it down
# showed BOTH waits ending fast with nothing found (Continue: WARNED at
# the full ~90s only because nothing ever appeared, not because it was
# slow to find something; Go home: WARNED in 0.67s) — neither overlay was
# ever on screen. The actual blocker, confirmed via the failing screenshot
# itself, was the app already being authenticated and routed to the
# ONBOARDING wizard instead: Maestro flows don't clear app state between
# each other (only two flows use `clearState: true`), so once any flow in
# a job successfully logs in as the seeded `testuser` — who has
# `onboardingCompleted: false` — every later flow's reconnect inherits
# that session and lands on onboarding, never on Sign In. See
# todos/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md Updates
# for the full evidence chain and candidate fixes (session isolation is a
# flow-semantics decision, not made here). Reverted this file to its
# pre-session baseline (5000ms wait, no dev-menu handling) since neither
# change was fixing a real problem and the 90s wait was adding ~90s of
# dead time to every stuck flow.
#
# ORIGINAL ROOT CAUSE this wait targets, confirmed via Maestro's own
# screenshot artifact on live CI (2026-08-16, run 31938889879 — see the
# todo's Updates): the app DOES connect to Metro and DOES render the real
# "Sign In" screen underneath — the Expo dev-client's own "developer menu"
# welcome overlay ("This is the developer menu... Continue") can pop up on
# top of it on a fresh launch, dimming/blocking the login screen so
# Maestro's assertVisible never sees it as interactable. `optional: true`
# means this step does NOT fail the flow if the overlay doesn't appear
# (e.g. once Expo stops showing it after a device has "seen" it before).
#
# `localhost:8081` resolves correctly on both CI jobs: the Android job's
# `adb reverse tcp:8081 tcp:8081` step tunnels the emulator's localhost to
# the runner's Metro; the iOS simulator shares the host Mac's loopback
# natively, no tunnel needed.
---
- openLink: "exp+ocrecipes://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 5000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
