appId: com.ocrecipes.app

# Reusable "get me to a logged-out Sign In screen" helper — the replacement
# for `launchApp: { clearState: true }`, which is unusable here (2026-08-30,
# evidence: dispatch-9 artifacts — see
# todos/archive/P2-2026-08-15-e2e-regression-workflow-has-never-passed.md):
# on Android (where the declared appId matches the installed package)
# `pm clear` wipes the dev client's OWN storage, stranding the relaunch on
# the dev-client launcher screen; on iOS it errored outright because the
# app's identifiers are split per platform (iOS builds as
# com.williamtower.ocrecipes, flows declare the Android com.ocrecipes.app —
# "Failed to get app binary directory" = no such bundle). Driving the app's
# real Sign Out control instead goes through tokenStorage.clear() in-process
# — no relaunch, no dev-client hazards, no appId dependence — and gives the
# suite genuine logout coverage as a bonus.
#
# Call AFTER e2e/helpers/launch-app.yaml. Exits on the Sign In screen.
#
# Three entry states are possible:
#   Sign In   — already logged out: both gated blocks skip, contract holds.
#   Hello.*   — Main app: the logout block walks Profile tab → Settings →
#               Sign Out → confirms the in-app confirmation sheet.
#   wizard    — a PREVIOUS attempt died mid-onboarding, leaving an account
#               with onboardingCompleted:false; relaunch routes straight into
#               the wizard (Get Started / Go back screens), which has no tab
#               bar and no logout. Without the escape below, one onboarding
#               flake would turn the whole retry attempt into a guaranteed
#               red job. The escape is one linear pass of optional taps in
#               wizard screen order. The wizard RESUMES AT ITS STRANDED
#               SCREEN after relaunch (drill-verified 2026-08-30: killed at
#               screen 4/8, relaunch came back mid-wizard — position
#               persists; an earlier assumption that relaunch resets to
#               Welcome is FALSE), so the mid-wizard traversal is the
#               actually-exercised path, not belt-and-braces: each screen's
#               skip/none tap advances, and a screen with a selection
#               already made relabels its advance button to "Continue"
#               (Allergies/HealthConditions/DietType), hence the interleaved
#               optional "Continue" taps — do not remove them. The terminal
#               TastePicks tap is what sets onboardingCompleted:true. Zero
#               cost when not stranded: the `when:` gate skips the whole
#               block.
---
- extendedWaitUntil:
    visible: "(Sign In|Hello.*|Get Started|Go back)"
    timeout: 30000

# Wizard-escape — only when neither Sign In nor Home is showing (see header)
- runFlow:
    when:
      notVisible: "(Sign In|Hello.*)"
    commands:
      - tapOn:
          text: "Skip.*for now"
          optional: true
      - tapOn:
          text: "Not now.*"
          optional: true
      - tapOn:
          text: "No Allergies"
          optional: true
      # Selection-flipped Allergies screen reads "Continue" instead
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "None of These"
          optional: true
      # Selection-flipped HealthConditions screen reads "Continue" instead
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Skip"
          optional: true
      # DietType (selection-flipped) then Goals both advance via "Continue"
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Next step"
          optional: true
      - tapOn:
          text: "Skip.*for now"
          optional: true
      - extendedWaitUntil:
          visible: "Hello.*"
          timeout: 30000

# UI logout — only when authenticated (Main app showing)
- runFlow:
    when:
      notVisible: "Sign In"
    commands:
      - tapOn:
          id: "tab-profile"
      # Gear button on ProfileCard (a11y label "Settings"); Settings is a
      # ProfileStack screen
      - tapOn: "Settings"
      - tapOn: "Sign Out"
      # In-app ConfirmationModal sheet (issue #908). This was a native
      # Alert.alert, which the CI simulator intermittently rendered ON SCREEN
      # while exposing NO alert nodes to the accessibility hierarchy for 30s+
      # (run 33935553286 attempt-1: the failure screenshot shows the alert up,
      # the same moment's hierarchy dump has no alert in it) — no hierarchy
      # wait or tap can ever see such an alert, which is why raising this
      # wait's timeout (closed PR #919) changed nothing. The sheet lives in
      # the app's own view tree, so it is always exposed, and its confirm
      # button's distinct "Yes, Sign Out" label is a unique full-string match
      # (the Settings row and the sheet title both read "Sign Out") — no
      # index needed, nothing to silently reorder.
      - extendedWaitUntil:
          visible: "Are you sure you want to sign out.*"
          timeout: 10000
      - tapOn: "Yes, Sign Out"
      - extendedWaitUntil:
          visible: "Sign In"
          timeout: 30000

# Contract: this helper exits on the Sign In screen
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 10000
